
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vælg et skab</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .language {
      text-align: right;
      max-width: 1000px;
      margin: 0 auto 10px auto;
    }

    .language button {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-weight: bold;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .floor {
      background: white;
      max-width: 1000px;
      margin: 0 auto 30px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .floor h2 {
      margin-top: 0;
      font-size: 26px;
    }

    .lockers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .locker {
      width: 75px;
      height: 55px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 15px;
    }

    .available {
      background: #22c55e;
      cursor: pointer;
    }

    .occupied {
      background: #ef4444;
      cursor: pointer;
    }

    .defect {
      background: #eab308;
      cursor: pointer;
    }

    .request-actions {
      max-width: 900px;
      margin: 0 auto 22px auto;
      display: flex;
      gap: 12px;
    }

    .request-actions button {
      flex: 1;
      padding: 15px;
      border: 0;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .request-actions .fault-button { background: #d97706; }
    .request-actions .request-button { background: #2563eb; }

    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
    }

    @media (max-width: 600px) {
      .request-actions { flex-direction: column; }
      .modal-box { margin: 20px auto; max-height: 85vh; overflow-y: auto; }
    }

    .instruction {
      max-width: 900px;
      margin: 0 auto 22px auto;
      padding: 16px 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      line-height: 1.5;
      text-align: left;
    }

    .instruction strong {
      display: block;
      margin-bottom: 6px;
      font-size: 17px;
    }

    .legend {
      margin: 20px auto 30px auto;
      font-size: 16px;
    }

    .legend span {
      display: inline-block;
      margin: 5px 10px;
      font-weight: bold;
    }

    .status {
      margin-top: 25px;
      font-size: 18px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-box {
      max-width: 500px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: left;
    }

    .modal-box h2 {
      margin-top: 0;
      text-align: center;
    }

    .selected-locker {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .action-button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .fault-button {
      background: #f59e0b;
    }

    .request-button {
      background: #2563eb;
    }

    .cancel-button {
      background: #777;
    }

    .modal-status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="language">
    <button onclick="setLanguage('da')">🇩🇰 Dansk</button>
    <button onclick="setLanguage('en')">🇬🇧 English</button>
  </div>

  <h1 id="pageTitle">Vælg et skab</h1>

  <div class="instruction">
    <strong id="instructionTitle">Har du problemer med dit skab?</strong>
    <span id="instructionText">Vælg en af mulighederne herunder. Du skal bruge dit eget skabsnummer.</span>
  </div>

  <div class="request-actions">
    <button class="fault-button" id="openFaultButton" onclick="openRequestModal('Fejlmelding')">🔧 Fejlmeld skab</button>
    <button class="request-button" id="openCodeButton" onclick="openRequestModal('Anmodning')">🔑 Anmod om ny skabskode</button>
  </div>

  <div class="legend">
    <span id="availableText">🟢 Ledigt</span>
    <span id="occupiedText">🔴 Optaget</span>
    <span id="defectText">🟡 Defekt</span>
  </div>

  <div id="lockers">
    Indlæser skabe...
  </div>

  <div class="status" id="status"></div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h2 id="modalTitle">Anmodning</h2>

      <label for="employeeName" id="nameLabel">Fulde navn</label>
      <input type="text" id="employeeName" autocomplete="name" placeholder="Dit fulde navn">

      <label for="employeeEmail" id="emailLabel">Norlys-e-mail</label>
      <input type="email" id="employeeEmail" autocomplete="email" placeholder="navn@norlys.dk">

      <label for="floorSelect" id="floorLabel">Etage</label>
      <select id="floorSelect" onchange="updateLockerOptions()">
        <option value="">Vælg etage</option>
      </select>

      <label for="lockerSelect" id="lockerLabel">Skabsnummer</label>
      <select id="lockerSelect" onchange="updateSelectedLocker()" disabled>
        <option value="">Vælg først etage</option>
      </select>

      <div id="faultFields">
        <label for="problemMessage" id="problemLabel">Beskriv problemet</label>
        <textarea id="problemMessage" placeholder="Beskriv problemet..."></textarea>
      </div>

      <div id="codeFields" style="display:none;">
        <label for="requestedCode" id="codeLabel">Ønsket ny 4-cifret skabskode</label>
        <input type="text" id="requestedCode" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="F.eks. 0427" autocomplete="off">
      </div>

      <button class="action-button request-button" id="sendButton" onclick="sendRequest()">Send anmodning</button>
      <button class="action-button cancel-button" id="cancelButton" onclick="closeModal()">Annuller</button>
      <div class="modal-status" id="modalStatus"></div>
    </div>
  </div>

<script>

const SUPABASE_URL = "https://pwgwujojffxinfbqjlyb.supabase.co";
const SUPABASE_KEY = "sb_publishable_XU7y4WVGX4Osj7ixgRIfDA_mHpJ1ttv";

let currentLanguage = localStorage.getItem("lockerLanguage") || "da";
let allLockers = [];
let requestType = "Fejlmelding";
let selectedLocker = "";

const translations = {
  da: {
    title: "Vælg et skab",
    instructionTitle: "Har du problemer med dit skab?",
    instructionText: "Vælg en af mulighederne herunder. Du skal bruge dit eget skabsnummer.",
    available: "🟢 Ledigt", occupied: "🔴 Optaget", defect: "🟡 Defekt",
    ground: "Stuen", floor1: "Etage 1", floor2: "Etage 2", floor3: "Etage 3",
    loading: "Indlæser skabe...", status: "Grøn = ledigt · Rød = optaget · Gul = defekt",
    name: "Fulde navn", email: "Norlys-e-mail", floor: "Etage", locker: "Skabsnummer",
    chooseFloor: "Vælg etage", chooseLocker: "Vælg skab", noLockers: "Ingen optagede skabe på denne etage",
    problem: "Beskriv problemet", code: "Ønsket ny 4-cifret skabskode",
    fault: "🔧 Fejlmeld skab", request: "🔑 Anmod om ny skabskode",
    send: "Send anmodning", cancel: "Annuller", nameRequired: "Indtast dit fulde navn.",
    emailRequired: "Brug din Norlys-e-mail.", floorRequired: "Vælg en etage.", lockerRequired: "Vælg dit skab.",
    problemRequired: "Beskriv venligst problemet.", codeRequired: "Indtast en kode på præcis 4 cifre.",
    sending: "Sender anmodning...", sent: "✅ Din anmodning er sendt til administrationen.",
    error: "Der opstod en fejl."
  },
  en: {
    title: "Choose a locker",
    instructionTitle: "Having problems with your locker?",
    instructionText: "Choose one of the options below. You must use your own locker number.",
    available: "🟢 Available", occupied: "🔴 Occupied", defect: "🟡 Defective",
    ground: "Ground floor", floor1: "1st floor", floor2: "2nd floor", floor3: "3rd floor",
    loading: "Loading lockers...", status: "Green = available · Red = occupied · Yellow = defective",
    name: "Full name", email: "Norlys email", floor: "Floor", locker: "Locker number",
    chooseFloor: "Choose floor", chooseLocker: "Choose locker", noLockers: "No occupied lockers on this floor",
    problem: "Describe the problem", code: "Requested new 4-digit locker code",
    fault: "🔧 Report a problem", request: "🔑 Request a new locker code",
    send: "Send request", cancel: "Cancel", nameRequired: "Enter your full name.",
    emailRequired: "Use your Norlys email.", floorRequired: "Choose a floor.", lockerRequired: "Choose your locker.",
    problemRequired: "Please describe the problem.", codeRequired: "Enter a code of exactly 4 digits.",
    sending: "Sending request...", sent: "✅ Your request has been sent to the administration.",
    error: "An error occurred."
  }
};

function setLanguage(language) {
  currentLanguage = language;
  localStorage.setItem("lockerLanguage", language);
  const t = translations[language];
  document.documentElement.lang = language;
  document.getElementById("pageTitle").textContent = t.title;
  document.getElementById("instructionTitle").textContent = t.instructionTitle;
  document.getElementById("instructionText").textContent = t.instructionText;
  document.getElementById("availableText").textContent = t.available;
  document.getElementById("occupiedText").textContent = t.occupied;
  document.getElementById("defectText").textContent = t.defect;
  document.getElementById("status").textContent = t.status;
  document.getElementById("nameLabel").textContent = t.name;
  document.getElementById("emailLabel").textContent = t.email;
  document.getElementById("floorLabel").textContent = t.floor;
  document.getElementById("lockerLabel").textContent = t.locker;
  document.getElementById("problemLabel").textContent = t.problem;
  document.getElementById("codeLabel").textContent = t.code;
  document.getElementById("openFaultButton").textContent = t.fault;
  document.getElementById("openCodeButton").textContent = t.request;
  document.getElementById("sendButton").textContent = t.send;
  document.getElementById("cancelButton").textContent = t.cancel;
  loadLockers();
}

function floorName(floor) {
  const t = translations[currentLanguage];
  return ({0:t.ground, 1:t.floor1, 2:t.floor2, 3:t.floor3})[floor] || `${t.floor} ${floor}`;
}

async function loadLockers() {
  const container = document.getElementById("lockers");
  const t = translations[currentLanguage];
  container.textContent = t.loading;
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/lockers?select=locker_number,floor,status,defect,assigned_at`, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
    if (!response.ok) throw new Error(`Fejl ${response.status}: ${await response.text()}`);
    allLockers = await response.json();
    allLockers.sort((a,b) => a.locker_number.localeCompare(b.locker_number, undefined, {numeric:true}));
    container.innerHTML = "";
    for (let floor = 0; floor <= 3; floor++) {
      const floorLockers = allLockers.filter(x => Number(x.floor) === floor);
      if (!floorLockers.length) continue;
      const floorDiv = document.createElement("div");
      floorDiv.className = "floor";
      const title = document.createElement("h2");
      title.textContent = floorName(floor);
      floorDiv.appendChild(title);
      const lockersDiv = document.createElement("div");
      lockersDiv.className = "lockers";
      floorLockers.forEach(locker => {
        const lockerDiv = document.createElement("div");
        const isAvailable = locker.status === "available" && locker.defect !== true;
        lockerDiv.className = "locker " + (locker.defect === true ? "defect" : (isAvailable ? "available" : "occupied"));
        lockerDiv.textContent = locker.locker_number;
        if (isAvailable) {
          lockerDiv.onclick = () => window.location.href = `registrer.html?locker=${encodeURIComponent(locker.locker_number)}`;
        } else if (locker.status === "occupied") {
          lockerDiv.onclick = () => openRequestModal("Fejlmelding", locker.locker_number);
          lockerDiv.title = currentLanguage === "da" ? "Optaget skab" : "Occupied locker";
        }
        lockersDiv.appendChild(lockerDiv);
      });
      floorDiv.appendChild(lockersDiv);
      container.appendChild(floorDiv);
    }
    document.getElementById("status").textContent = t.status;
    populateFloorOptions();
  } catch (error) {
    container.innerHTML = "";
    document.getElementById("status").textContent = `${t.error} ${error.message}`;
  }
}

function populateFloorOptions() {
  const select = document.getElementById("floorSelect");
  const current = select.value;
  const floors = [...new Set(allLockers.filter(x => x.status === "occupied").map(x => Number(x.floor)))].sort((a,b) => a-b);
  select.innerHTML = `<option value="">${translations[currentLanguage].chooseFloor}</option>`;
  floors.forEach(floor => {
    const option = document.createElement("option");
    option.value = String(floor);
    option.textContent = floorName(floor);
    select.appendChild(option);
  });
  if (floors.includes(Number(current))) select.value = current;
  updateLockerOptions();
}

function updateLockerOptions(preselect = "") {
  const floor = document.getElementById("floorSelect").value;
  const select = document.getElementById("lockerSelect");
  const t = translations[currentLanguage];
  select.innerHTML = `<option value="">${t.chooseLocker}</option>`;
  const lockers = allLockers.filter(x => x.status === "occupied" && Number(x.floor) === Number(floor));
  lockers.forEach(locker => {
    const option = document.createElement("option");
    option.value = locker.locker_number;
    option.textContent = locker.locker_number + (locker.defect === true ? (currentLanguage === "da" ? " (defekt)" : " (defective)") : "");
    select.appendChild(option);
  });
  select.disabled = !floor || lockers.length === 0;
  if (preselect && lockers.some(x => x.locker_number === preselect)) select.value = preselect;
  else if (lockers.length === 0) select.innerHTML = `<option value="">${t.noLockers}</option>`;
  updateSelectedLocker();
}

function updateSelectedLocker() {
  selectedLocker = document.getElementById("lockerSelect").value;
}

function openRequestModal(type, lockerNumber = "") {
  requestType = type;
  const t = translations[currentLanguage];
  document.getElementById("modalTitle").textContent = type === "Fejlmelding" ? t.fault : t.request;
  document.getElementById("faultFields").style.display = type === "Fejlmelding" ? "block" : "none";
  document.getElementById("codeFields").style.display = type === "Anmodning" ? "block" : "none";
  document.getElementById("employeeName").value = "";
  document.getElementById("employeeEmail").value = "";
  document.getElementById("problemMessage").value = "";
  document.getElementById("requestedCode").value = "";
  document.getElementById("modalStatus").textContent = "";
  document.getElementById("floorSelect").value = "";
  updateLockerOptions(lockerNumber);
  if (lockerNumber) {
    const locker = allLockers.find(x => x.locker_number === lockerNumber);
    if (locker) {
      document.getElementById("floorSelect").value = String(locker.floor);
      updateLockerOptions(lockerNumber);
    }
  }
  document.getElementById("modal").style.display = "block";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

async function sendRequest() {
  const name = document.getElementById("employeeName").value.trim();
  const email = document.getElementById("employeeEmail").value.trim();
  const message = document.getElementById("problemMessage").value.trim();
  const requestedCode = document.getElementById("requestedCode").value.trim();
  const status = document.getElementById("modalStatus");
  const t = translations[currentLanguage];

  if (!name) return status.textContent = t.nameRequired;
  if (!email || !email.toLowerCase().endsWith("@norlys.dk")) return status.textContent = t.emailRequired;
  if (!document.getElementById("floorSelect").value) return status.textContent = t.floorRequired;
  if (!selectedLocker) return status.textContent = t.lockerRequired;
  if (requestType === "Fejlmelding" && !message) return status.textContent = t.problemRequired;
  if (requestType === "Anmodning" && !/^\d{4}$/.test(requestedCode)) return status.textContent = t.codeRequired;

  status.textContent = t.sending;
  document.getElementById("sendButton").disabled = true;
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/submit_locker_request_by_email`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({
        p_locker_number: selectedLocker,
        p_employee_name: name,
        p_employee_email: email,
        p_request_type: requestType,
        p_message: requestType === "Fejlmelding" ? message : null,
        p_requested_code: requestType === "Anmodning" ? requestedCode : null
      })
    });
    if (!response.ok) throw new Error(`Fejl ${response.status}: ${await response.text()}`);
    status.textContent = t.sent;
    setTimeout(closeModal, 1800);
  } catch (error) {
    status.textContent = error.message;
  } finally {
    document.getElementById("sendButton").disabled = false;
  }
}

setLanguage(currentLanguage);

</script>

</body>
</html>
