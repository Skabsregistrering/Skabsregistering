<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Skabsregistrering</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    h1 {
      text-align: center;
      margin: 10px 0;
    }

    .info {
      text-align: center;
      color: #555;
      margin-bottom: 25px;
    }

    .floor {
      background: white;
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 12px;
    }

    .floor h2 {
      margin-top: 0;
    }

    .lockers {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }

    .locker {
      padding: 15px 5px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .available {
      background: #d1fae5;
      color: #065f46;
      cursor: pointer;
    }

    .available:hover {
      background: #a7f3d0;
    }

    .occupied {
      background: #fee2e2;
      color: #991b1b;
    }

    .status {
      font-size: 12px;
      font-weight: normal;
      margin-top: 5px;
    }

    #error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
      margin: 20px auto;
      max-width: 700px;
      display: none;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>Skabsregistrering</h1>

  <div class="info">
    Vælg et ledigt skab
  </div>

  <div id="error"></div>

  <div id="lockers">
    Henter skabe...
  </div>

<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_G7rR-9dHQEdLCLpysjNeKA_VHqhCsYz";


async function loadLockers() {

  const container = document.getElementById("lockers");
  const errorBox = document.getElementById("error");

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/lockers" +
      "?select=locker_number,floor,status,qr_token" +
      "&order=locker_number";

    const response = await fetch(url, {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });

    if (!response.ok) {

      const errorText = await response.text();

      throw new Error(
        "Supabase HTTP " +
        response.status +
        ": " +
        errorText
      );
    }

    const lockers = await response.json();

    if (!Array.isArray(lockers)) {
      throw new Error("Supabase returnerede ikke en liste.");
    }

    container.innerHTML = "";

    if (lockers.length === 0) {
      container.innerHTML =
        "<p style='text-align:center;'>Ingen skabe fundet.</p>";
      return;
    }

    const floors = {};

    lockers.forEach(locker => {

      if (!floors[locker.floor]) {
        floors[locker.floor] = [];
      }

      floors[locker.floor].push(locker);

    });


    Object.keys(floors)
      .sort((a, b) => Number(a) - Number(b))
      .forEach(floor => {

        const floorDiv =
          document.createElement("div");

        floorDiv.className = "floor";


        const title =
          document.createElement("h2");

        title.textContent =
          Number(floor) === 0
            ? "Stuen"
            : "Etage " + floor;

        floorDiv.appendChild(title);


        const lockerGrid =
          document.createElement("div");

        lockerGrid.className = "lockers";


        floors[floor].forEach(locker => {

          const box =
            document.createElement("div");

          const isAvailable =
            locker.status === "available";


          box.className =
            "locker " +
            (isAvailable
              ? "available"
              : "occupied");


          box.innerHTML =
            "SKAB " +
            locker.locker_number +
            "<div class='status'>" +
            (isAvailable
              ? "Ledigt"
              : "Optaget") +
            "</div>";


          if (isAvailable) {

            box.addEventListener("click", function() {

              if (!locker.qr_token) {
                alert("Dette skab mangler QR-token.");
                return;
              }

              window.location.href =
                "index.html?token=" +
                encodeURIComponent(
                  locker.qr_token
                );

            });

          }


          lockerGrid.appendChild(box);

        });


        floorDiv.appendChild(lockerGrid);
        container.appendChild(floorDiv);

      });

  } catch (error) {

    console.error(error);

    container.innerHTML = "";

    errorBox.style.display = "block";

    errorBox.innerHTML =
      "<strong>Der kunne ikke hentes skabe.</strong><br><br>" +
      error.message;

  }

}


loadLockers();

</script>

</body>
</html>
