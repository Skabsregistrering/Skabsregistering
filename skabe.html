<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vælg skab</title>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f3f6f4;
}

h1 {
  text-align: center;
}

.info {
  text-align: center;
  margin-bottom: 20px;
}

#message {
  text-align: center;
  padding: 20px;
  font-weight: bold;
}

.floor {
  background: white;
  padding: 18px;
  margin-bottom: 20px;
  border-radius: 14px;
}

.lockers {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
  gap: 10px;
}

.locker {
  padding: 15px 5px;
  border-radius: 9px;
  text-align: center;
  font-weight: bold;
}

.available {
  background: #d1fae5;
  color: #065f46;
}

.occupied {
  background: #fee2e2;
  color: #991b1b;
}
</style>
</head>

<body>

<h1>Skabsregistrering</h1>

<div class="info">
Vælg et ledigt skab
</div>

<div id="message">
Henter skabe...
</div>

<div id="lockers"></div>

<script>

const SUPABASE_URL =
"https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_G7rR-9dHQEdLCLpysjNeKA_VHqhCsYz";

async function loadLockers() {

  const message = document.getElementById("message");
  const container = document.getElementById("lockers");

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/lockers?select=id,locker_number,floor,status,employee_id,updated_at&order=locker_number`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const lockers = await response.json();

    console.log(lockers);

    if (lockers.length === 0) {
      message.textContent = "Ingen skabe fundet.";
      return;
    }

    message.textContent = "";

    const floors = {};

    lockers.forEach(locker => {

      if (!floors[locker.floor]) {
        floors[locker.floor] = [];
      }

      floors[locker.floor].push(locker);

    });

    Object.keys(floors)
      .sort((a,b) => Number(a) - Number(b))
      .forEach(floor => {

        const floorDiv = document.createElement("div");
        floorDiv.className = "floor";

        const title = document.createElement("h2");

        title.textContent =
          Number(floor) === 0
          ? "Stuen"
          : "Etage " + floor;

        floorDiv.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "lockers";

        floors[floor].forEach(locker => {

          const box = document.createElement("div");

          const available =
            locker.status !== "occupied";

          box.className =
            "locker " +
            (available ? "available" : "occupied");

          box.innerHTML =
            "SKAB " +
            locker.locker_number +
            "<br>" +
            (available ? "Ledigt" : "Optaget");

          grid.appendChild(box);

        });

        floorDiv.appendChild(grid);
        container.appendChild(floorDiv);

      });

  } catch (error) {

    console.error(error);

    message.textContent =
      "Fejl: " + error.message;

  }
}

loadLockers();

</script>

</body>
</html>
