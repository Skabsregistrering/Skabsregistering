<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vælg et skab</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .floor {
      background: white;
      max-width: 1000px;
      margin: 0 auto 30px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .floor h2 {
      margin-top: 0;
      font-size: 26px;
    }

    .lockers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .locker {
      width: 75px;
      height: 55px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 15px;
    }

    .available {
      background: #22c55e;
      cursor: pointer;
    }

    .occupied {
      background: #ef4444;
      cursor: pointer;
    }

    .defect {
      background: #eab308;
      cursor: not-allowed;
    }

    .legend {
      margin: 20px auto 30px auto;
      font-size: 16px;
    }

    .legend span {
      display: inline-block;
      margin: 5px 10px;
      font-weight: bold;
    }

    .status {
      margin-top: 25px;
      font-size: 18px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-box {
      max-width: 500px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: left;
    }

    .modal-box h2 {
      margin-top: 0;
      text-align: center;
    }

    .selected-locker {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .action-button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .fault-button {
      background: #f59e0b;
    }

    .reset-button {
      background: #2563eb;
    }

    .cancel-button {
      background: #777;
    }

    .modal-status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Vælg et skab</h1>

  <div class="legend">
    <span>🟢 Ledigt</span>
    <span>🔴 Optaget</span>
    <span>🟡 Defekt</span>
  </div>

  <div id="lockers">
    Indlæser skabe...
  </div>

  <div class="status" id="status"></div>

  <div class="modal" id="modal">

    <div class="modal-box">

      <h2>Skab</h2>

      <div class="selected-locker" id="selectedLocker"></div>

      <label for="employeeEmail">
        Norlys-e-mail
      </label>

      <input
        type="email"
        id="employeeEmail"
        placeholder="navn@norlys.dk"
      >

      <label for="employeeName">
        Fulde navn
      </label>

      <input
        type="text"
        id="employeeName"
        placeholder="Fornavn Efternavn"
      >

      <label for="problemMessage">
        Hvad er problemet?
      </label>

      <textarea
        id="problemMessage"
        placeholder="Beskriv problemet..."
      ></textarea>

      <button
        class="action-button fault-button"
        onclick="sendRequest('Fejlmelding')"
      >
        🔧 Fejlmeld skab
      </button>

      <button
        class="action-button reset-button"
        onclick="sendRequest('Nulstilling ønsket')"
      >
        🔄 Nulstil mit skab
      </button>

      <button
        class="action-button cancel-button"
        onclick="closeModal()"
      >
        Annuller
      </button>

      <div
        class="modal-status"
        id="modalStatus"
      ></div>

    </div>

  </div>

<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XU7y4WVGX4Osj7ixgRIfDA_mHpJ1ttv";

let selectedLocker = "";


async function loadLockers() {

  const container =
    document.getElementById("lockers");

  const status =
    document.getElementById("status");

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/lockers?select=locker_number,floor,status,defect`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {

      const errorText =
        await response.text();

      container.innerHTML = "";

      status.innerHTML =
        `<strong>Fejl ${response.status}</strong><br><br>${errorText}`;

      return;
    }

    const data =
      await response.json();

    data.sort((a, b) =>
      a.locker_number.localeCompare(
        b.locker_number,
        undefined,
        { numeric: true }
      )
    );

    container.innerHTML = "";

    const floors = {
      0: "Stuen",
      1: "Etage 1",
      2: "Etage 2",
      3: "Etage 3"
    };

    for (let floor = 0; floor <= 3; floor++) {

      const floorLockers =
        data.filter(
          locker => Number(locker.floor) === floor
        );

      if (floorLockers.length === 0) {
        continue;
      }

      const floorDiv =
        document.createElement("div");

      floorDiv.className =
        "floor";

      const title =
        document.createElement("h2");

      title.textContent =
        floors[floor];

      floorDiv.appendChild(title);

      const lockersDiv =
        document.createElement("div");

      lockersDiv.className =
        "lockers";

      floorLockers.forEach(locker => {

        const lockerDiv =
          document.createElement("div");

        let lockerClass =
          "occupied";

        if (locker.defect === true) {

          lockerClass =
            "defect";

        } else if (
          locker.status === "available"
        ) {

          lockerClass =
            "available";

        }

        lockerDiv.className =
          "locker " + lockerClass;

        lockerDiv.textContent =
          locker.locker_number;

        if (
          locker.status === "available" &&
          locker.defect !== true
        ) {

          lockerDiv.onclick =
            function() {

              window.location.href =
                `registrer.html?locker=${encodeURIComponent(
                  locker.locker_number
                )}`;

            };

        }

        if (
          locker.status === "occupied" &&
          locker.defect !== true
        ) {

          lockerDiv.onclick =
            function() {

              openRequestModal(
                locker.locker_number
              );

            };

        }

        lockersDiv.appendChild(
          lockerDiv
        );

      });

      floorDiv.appendChild(
        lockersDiv
      );

      container.appendChild(
        floorDiv
      );

    }

    status.textContent =
      "Grøn = ledigt · Rød = optaget · Gul = defekt";

  } catch (error) {

    container.innerHTML = "";

    status.innerHTML =
      "<strong>Der opstod en fejl.</strong><br><br>" +
      error.message;

  }

}


function openRequestModal(
  lockerNumber
) {

  selectedLocker =
    lockerNumber;

  document
    .getElementById("selectedLocker")
    .textContent =
      "Skab " + lockerNumber;

  document
    .getElementById("employeeEmail")
    .value = "";

  document
    .getElementById("employeeName")
    .value = "";

  document
    .getElementById("problemMessage")
    .value = "";

  document
    .getElementById("modalStatus")
    .textContent = "";

  document
    .getElementById("modal")
    .style.display =
      "block";

}


function closeModal() {

  document
    .getElementById("modal")
    .style.display =
      "none";

}


async function sendRequest(
  requestType
) {

  const email =
    document
      .getElementById("employeeEmail")
      .value
      .trim();

  const name =
    document
      .getElementById("employeeName")
      .value
      .trim();

  const message =
    document
      .getElementById("problemMessage")
      .value
      .trim();

  const status =
    document
      .getElementById("modalStatus");

  if (
    !email ||
    !email.toLowerCase().endsWith("@norlys.dk")
  ) {

    status.textContent =
      "Brug din Norlys-e-mail.";

    return;

  }

  if (!name) {

    status.textContent =
      "Indtast dit fulde navn.";

    return;

  }

  if (
    requestType === "Fejlmelding" &&
    !message
  ) {

    status.textContent =
      "Beskriv venligst problemet.";

    return;

  }

  status.textContent =
    "Kontrollerer skabet...";

  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/submit_locker_request`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          },

          body: JSON.stringify({

            p_locker_number:
              selectedLocker,

            p_employee_email:
              email,

            p_employee_name:
              name,

            p_request_type:
              requestType,

            p_message:
              message || null

          })

        }
      );

    if (!response.ok) {

      const errorText =
        await response.text();

      if (
        errorText.includes(
          "Du kan kun lave en anmodning på dit eget skab"
        )
      ) {

        throw new Error(
          "❌ Du kan kun lave en anmodning på dit eget skab."
        );

      }

      throw new Error(
        `Fejl ${response.status}: ${errorText}`
      );

    }

    status.innerHTML =
      "✅ Anmodningen er sendt.";

    setTimeout(
      closeModal,
      1500
    );

  } catch (error) {

    status.textContent =
      error.message;

  }

}


loadLockers();

</script>

</body>
</html>
