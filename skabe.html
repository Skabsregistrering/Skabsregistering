<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vælg skab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      color: #222;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .info {
      text-align: center;
      color: #555;
      margin-bottom: 25px;
    }

    .floor {
      background: white;
      padding: 18px;
      margin-bottom: 20px;
      border-radius: 14px;
    }

    .floor h2 {
      margin-top: 0;
    }

    .lockers {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 10px;
    }

    .locker {
      padding: 14px 5px;
      border-radius: 9px;
      text-align: center;
      font-weight: bold;
    }

    .available {
      background: #d1fae5;
      color: #065f46;
      cursor: pointer;
    }

    .occupied {
      background: #fee2e2;
      color: #991b1b;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      font-weight: normal;
    }

    #message {
      text-align: center;
      padding: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>Vælg et skab</h1>

<div class="info">
  Grøn = ledigt &nbsp; | &nbsp; Rød = optaget
</div>

<div id="message">
  Henter skabe...
</div>

<div id="lockers"></div>

<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_G7rR-9dHQEdLCLpysjNeKA_VHqhCsYz";


async function loadLockers() {

  const message =
    document.getElementById("message");

  const container =
    document.getElementById("lockers");

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/lockers?select=locker_number,floor,status,qr_token",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(
        response.status + " " + error
      );
    }

    const lockers =
      await response.json();

    if (!lockers.length) {

      message.textContent =
        "Ingen skabe fundet.";

      return;
    }

    message.textContent = "";

    const floors = {};

    lockers.forEach(locker => {

      if (!floors[locker.floor]) {
        floors[locker.floor] = [];
      }

      floors[locker.floor].push(locker);

    });


    Object.keys(floors)
      .sort((a, b) => Number(a) - Number(b))
      .forEach(floor => {

        const floorDiv =
          document.createElement("div");

        floorDiv.className = "floor";


        const heading =
          document.createElement("h2");

        heading.textContent =
          Number(floor) === 0
            ? "Stuen"
            : "Etage " + floor;

        floorDiv.appendChild(heading);


        const grid =
          document.createElement("div");

        grid.className = "lockers";


        floors[floor].forEach(locker => {

          const box =
            document.createElement("div");

          const available =
            locker.status === "available";


          box.className =
            "locker " +
            (available
              ? "available"
              : "occupied");


          box.innerHTML =
            "SKAB " +
            locker.locker_number +
            "<div class='status'>" +
            (available
              ? "Ledigt"
              : "Optaget") +
            "</div>";


          if (available) {

            box.onclick = function() {

              window.location.href =
                "index.html?token=" +
                encodeURIComponent(
                  locker.qr_token
                );

            };

          }


          grid.appendChild(box);

        });


        floorDiv.appendChild(grid);
        container.appendChild(floorDiv);

      });

  } catch (error) {

    console.error(error);

    message.textContent =
      "Der kunne ikke hentes skabe.";

  }

}


loadLockers();

</script>

</body>
</html>
