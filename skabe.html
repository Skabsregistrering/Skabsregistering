<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vælg et skab</title>
</head>

<body>

<h1>Vælg et skab</h1>

<div id="message">Henter skabe...</div>

<script>
const SUPABASE_URL = "https://pwgwujojffxinfbqjlyb.supabase.co";
const SUPABASE_KEY = "sb_publishable_XU7y4WVGX4Osj7ixgRIfDA_mHpJ1ttv";

async function test() {
  const message = document.getElementById("message");

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/lockers?select=locker_number,floor,status",
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    const result = await response.text();

    message.innerHTML =
      "<pre>" +
      "HTTP: " + response.status + "\n\n" +
      result +
      "</pre>";

  } catch (error) {
    message.innerHTML =
      "<pre>JAVASCRIPT FEJL:\n\n" +
      error.message +
      "</pre>";
  }
}

test();
</script>

</body>
</html>
