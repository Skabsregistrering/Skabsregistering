<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Skabsregistrering</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      color: #d1d5db;
      font-size: 16px;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    .green {
      background: #22c55e;
    }

    .red {
      background: #ef4444;
    }

    .floor {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .floor h2 {
      margin: 0 0 18px;
      font-size: 21px;
    }

    .lockers {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 10px;
    }

    .locker {
      border: none;
      border-radius: 10px;
      padding: 14px 5px;
      font-size: 15px;
      font-weight: bold;
      transition: transform 0.1s;
    }

    .available {
      background: #dcfce7;
      color: #166534;
      cursor: pointer;
      border: 2px solid #86efac;
    }

    .available:hover {
      transform: scale(1.03);
      background: #bbf7d0;
    }

    .occupied {
      background: #fee2e2;
      color: #991b1b;
      border: 2px solid #fca5a5;
      cursor: not-allowed;
    }

    .status {
      font-size: 12px;
      font-weight: normal;
      margin-top: 5px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 25px;
      }

      .container {
        margin-top: 15px;
      }

      .floor {
        padding: 15px;
      }

      .lockers {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .locker {
        padding: 13px 3px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Skabsregistrering</h1>
    <p>Vælg et ledigt skab</p>
  </div>

  <div class="container">

    <div class="legend">
      <span>
        <span class="dot green"></span>
        Ledigt
      </span>

      <span>
        <span class="dot red"></span>
        Optaget
      </span>
    </div>

    <div id="lockers">
      <div class="loading">Henter skabe...</div>
    </div>

  </div>

<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_G7rR-9dHQEdLCLpysjNeKA_VHqhCsYz";

async function loadLockers() {

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/lockers?select=locker_number,floor,status,qr_token&order=locker_number",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    const lockers = await response.json();

    const container = document.getElementById("lockers");
    container.innerHTML = "";

    const floors = {};

    lockers.forEach(locker => {

      if (!floors[locker.floor]) {
        floors[locker.floor] = [];
      }

      floors[locker.floor].push(locker);

    });

    Object.keys(floors)
      .sort()
      .forEach(floor => {

        const floorDiv = document.createElement("div");
        floorDiv.className = "floor";

        const title = document.createElement("h2");

        title.textContent =
          floor == 0 ? "Stuen" : "Etage " + floor;

        floorDiv.appendChild(title);

        const lockerGrid = document.createElement("div");
        lockerGrid.className = "lockers";

        floors[floor].forEach(locker => {

          const box = document.createElement("div");

          const available =
            locker.status === "available";

          box.className =
            "locker " +
            (available ? "available" : "occupied");

          box.innerHTML =
            "SKAB " + locker.locker_number +
            '<div class="status">' +
            (available ? "Ledigt" : "Optaget") +
            "</div>";

          if (available) {

            box.onclick = function() {

              window.location.href =
                "index.html?token=" +
                encodeURIComponent(locker.qr_token);

            };

          }

          lockerGrid.appendChild(box);

        });

        floorDiv.appendChild(lockerGrid);
        container.appendChild(floorDiv);

      });

  } catch (error) {

    document.getElementById("lockers").innerHTML =
      '<div class="loading">Der kunne ikke hentes skabe.</div>';

    console.error(error);

  }
}

loadLockers();

</script>

</body>
</html>
