<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vælg et skab</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .language {
      text-align: right;
      max-width: 1000px;
      margin: 0 auto 10px auto;
    }

    .language button {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-weight: bold;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .floor {
      background: white;
      max-width: 1000px;
      margin: 0 auto 30px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .floor h2 {
      margin-top: 0;
      font-size: 26px;
    }

    .lockers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .locker {
      width: 75px;
      height: 55px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 15px;
    }

    .available {
      background: #22c55e;
      cursor: pointer;
    }

    .occupied {
      background: #ef4444;
      cursor: pointer;
    }

    .guest {
      background: #2563eb;
      cursor: pointer;
    }

    .guest-occupied {
      background: #2563eb;
      cursor: not-allowed;
    }

    .defect {
      background: #eab308;
      cursor: not-allowed;
    }

    .legend {
      margin: 20px auto 30px auto;
      font-size: 16px;
    }

    .legend span {
      display: inline-block;
      margin: 5px 10px;
      font-weight: bold;
    }

    .status {
      margin-top: 25px;
      font-size: 18px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-box {
      max-width: 500px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: left;
    }

    .modal-box h2 {
      margin-top: 0;
      text-align: center;
    }

    .selected-locker {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .action-button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .fault-button {
      background: #f59e0b;
    }

    .reset-button {
      background: #2563eb;
    }

    .cancel-button {
      background: #777;
    }

    .modal-status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="language">
    <button onclick="setLanguage('da')">🇩🇰 Dansk</button>
    <button onclick="setLanguage('en')">🇬🇧 English</button>
  </div>

  <h1 id="pageTitle">Vælg et skab</h1>

  <div class="legend">
    <span id="availableText">🟢 Ledigt</span>
    <span id="occupiedText">🔴 Optaget</span>
    <span id="guestText">🔵 Gæsteskab</span>
    <span id="defectText">🟡 Defekt</span>
  </div>

  <div id="lockers">
    Indlæser skabe...
  </div>

  <div class="status" id="status"></div>

  <div class="modal" id="modal">

    <div class="modal-box">

      <h2 id="modalTitle">Skab</h2>

      <div class="selected-locker" id="selectedLocker"></div>

      <label for="employeeEmail" id="emailLabel">
        Norlys-e-mail
      </label>

      <input
        type="email"
        id="employeeEmail"
        placeholder="navn@norlys.dk"
      >

      <label for="employeeName" id="nameLabel">
        Fulde navn
      </label>

      <input
        type="text"
        id="employeeName"
        placeholder="Fornavn Efternavn"
      >

      <label for="problemMessage" id="problemLabel">
        Hvad er problemet?
      </label>

      <textarea
        id="problemMessage"
        placeholder="Beskriv problemet..."
      ></textarea>

      <button
        class="action-button fault-button"
        onclick="sendRequest('Fejlmelding')"
        id="faultButton"
      >
        🔧 Fejlmeld skab
      </button>

      <button
        class="action-button reset-button"
        onclick="sendRequest('Nulstilling ønsket')"
        id="resetButton"
      >
        🔄 Nulstil mit skab
      </button>

      <button
        class="action-button cancel-button"
        onclick="closeModal()"
        id="cancelButton"
      >
        Annuller
      </button>

      <div
        class="modal-status"
        id="modalStatus"
      ></div>

    </div>

  </div>

<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XU7y4WVGX4Osj7ixgRIfDA_mHpJ1ttv";

const GUEST_LOCKERS = [
  "0.007",
  "0.008",
  "0.009"
];

let selectedLocker = "";
let currentLanguage =
  localStorage.getItem("lockerLanguage") || "da";

const translations = {

  da: {
    title: "Vælg et skab",
    available: "🟢 Ledigt",
    occupied: "🔴 Optaget",
    guest: "🔵 Gæsteskab",
    defect: "🟡 Defekt",
    ground: "Stuen",
    floor1: "Etage 1",
    floor2: "Etage 2",
    floor3: "Etage 3",
    loading: "Indlæser skabe...",
    status: "Grøn = ledigt · Rød = optaget · Blå = gæsteskab · Gul = defekt",
    locker: "Skab",
    email: "Norlys-e-mail",
    name: "Fulde navn",
    problem: "Hvad er problemet?",
    fault: "🔧 Fejlmeld skab",
    reset: "🔄 Nulstil mit skab",
    cancel: "Annuller",
    error: "Der opstod en fejl.",
    guestOccupied: "Optaget"
  },

  en: {
    title: "Choose a locker",
    available: "🟢 Available",
    occupied: "🔴 Occupied",
    guest: "🔵 Guest locker",
    defect: "🟡 Defective",
    ground: "Ground floor",
    floor1: "1st floor",
    floor2: "2nd floor",
    floor3: "3rd floor",
    loading: "Loading lockers...",
    status: "Green = available · Red = occupied · Blue = guest locker · Yellow = defective",
    locker: "Locker",
    email: "Norlys email",
    name: "Full name",
    problem: "What is the problem?",
    fault: "🔧 Report problem",
    reset: "🔄 Reset my locker",
    cancel: "Cancel",
    error: "An error occurred.",
    guestOccupied: "Occupied"
  }

};


function setLanguage(language) {

  currentLanguage = language;

  localStorage.setItem(
    "lockerLanguage",
    language
  );

  const t =
    translations[language];

  document.documentElement.lang =
    language;

  document.getElementById("pageTitle").textContent =
    t.title;

  document.getElementById("availableText").textContent =
    t.available;

  document.getElementById("occupiedText").textContent =
    t.occupied;

  document.getElementById("guestText").textContent =
    t.guest;

  document.getElementById("defectText").textContent =
    t.defect;

  document.getElementById("status").textContent =
    t.status;

  document.getElementById("modalTitle").textContent =
    t.locker;

  document.getElementById("emailLabel").textContent =
    t.email;

  document.getElementById("nameLabel").textContent =
    t.name;

  document.getElementById("problemLabel").textContent =
    t.problem;

  document.getElementById("faultButton").textContent =
    t.fault;

  document.getElementById("resetButton").textContent =
    t.reset;

  document.getElementById("cancelButton").textContent =
    t.cancel;

  loadLockers();
}


async function expireOldGuestLocker(locker) {

  if (!GUEST_LOCKERS.includes(locker.locker_number)) {
    return locker;
  }

  if (
    locker.status !== "occupied" ||
    !locker.assigned_at
  ) {
    return locker;
  }

  const assignedDate =
    new Date(locker.assigned_at)
      .toLocaleDateString("en-CA");

  const today =
    new Date()
      .toLocaleDateString("en-CA");

  if (assignedDate === today) {
    return locker;
  }

  try {

    await fetch(
      `${SUPABASE_URL}/rest/v1/lockers?locker_number=eq.${encodeURIComponent(locker.locker_number)}`,
      {
        method: "PATCH",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          status: "available",
          employee_id: null,
          assigned_at: null
        })
      }
    );

    locker.status = "available";
    locker.employee_id = null;
    locker.assigned_at = null;

  } catch (error) {
  }

  return locker;
}


async function loadLockers() {

  const container =
    document.getElementById("lockers");

  const status =
    document.getElementById("status");

  const t =
    translations[currentLanguage];

  container.innerHTML =
    t.loading;

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/lockers?select=locker_number,floor,status,defect,assigned_at`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {

      const errorText =
        await response.text();

      container.innerHTML = "";

      status.innerHTML =
        `<strong>Fejl ${response.status}</strong><br><br>${errorText}`;

      return;
    }

    let data =
      await response.json();

    for (const locker of data) {
      await expireOldGuestLocker(locker);
    }

    data.sort((a, b) =>
      a.locker_number.localeCompare(
        b.locker_number,
        undefined,
        { numeric: true }
      )
    );

    container.innerHTML = "";

    const floors = {
      0: t.ground,
      1: t.floor1,
      2: t.floor2,
      3: t.floor3
    };

    for (let floor = 0; floor <= 3; floor++) {

      const floorLockers =
        data.filter(
          locker => Number(locker.floor) === floor
        );

      if (floorLockers.length === 0) {
        continue;
      }

      const floorDiv =
        document.createElement("div");

      floorDiv.className =
        "floor";

      const title =
        document.createElement("h2");

      title.textContent =
        floors[floor];

      floorDiv.appendChild(title);

      const lockersDiv =
        document.createElement("div");

      lockersDiv.className =
        "lockers";

      floorLockers.forEach(locker => {

        const lockerDiv =
          document.createElement("div");

        const isGuest =
          GUEST_LOCKERS.includes(
            locker.locker_number
          );

        let lockerClass =
          "occupied";

        if (locker.defect === true) {

          lockerClass =
            "defect";

        } else if (
          isGuest &&
          locker.status === "occupied"
        ) {

          lockerClass =
            "guest-occupied";

        } else if (isGuest) {

          lockerClass =
            "guest";

        } else if (
          locker.status === "available"
        ) {

          lockerClass =
            "available";
        }

        lockerDiv.className =
          "locker " + lockerClass;

        lockerDiv.textContent =
          locker.locker_number;

        /*
         * LEDIGE SKABE
         * Kan vælges.
         */
        if (
          locker.status === "available" &&
          locker.defect !== true
        ) {

          lockerDiv.onclick =
            function() {

              window.location.href =
                `registrer.html?locker=${encodeURIComponent(
                  locker.locker_number
                )}`;

            };

        }

        /*
         * OPTAGEDE NORMALE SKABE
         * Kan stadig åbne fejlmelding/nulstilling.
         *
         * OPTAGEDE GÆSTESKABE
         * Gør ingenting og kan ikke åbnes.
         */
        if (
          locker.status === "occupied" &&
          locker.defect !== true &&
          !isGuest
        ) {

          lockerDiv.onclick =
            function() {

              openRequestModal(
                locker.locker_number
              );

            };

        }

        /*
         * Optaget gæsteskab:
         * Ingen klik og vis "Optaget" ved musen.
         */
        if (
          isGuest &&
          locker.status === "occupied"
        ) {

          lockerDiv.title =
            t.guestOccupied;

        }

        lockersDiv.appendChild(
          lockerDiv
        );

      });

      floorDiv.appendChild(
        lockersDiv
      );

      container.appendChild(
        floorDiv
      );
    }

    status.textContent =
      t.status;

  } catch (error) {

    container.innerHTML = "";

    status.innerHTML =
      `<strong>${t.error}</strong><br><br>` +
      error.message;

  }

}


function openRequestModal(lockerNumber) {

  selectedLocker =
    lockerNumber;

  document
    .getElementById("selectedLocker")
    .textContent =
      translations[currentLanguage].locker +
      " " +
      lockerNumber;

  document
    .getElementById("employeeEmail")
    .value = "";

  document
    .getElementById("employeeName")
    .value = "";

  document
    .getElementById("problemMessage")
    .value = "";

  document
    .getElementById("modalStatus")
    .textContent = "";

  document
    .getElementById("modal")
    .style.display =
      "block";
}


function closeModal() {

  document
    .getElementById("modal")
    .style.display =
      "none";
}


async function sendRequest(requestType) {

  const email =
    document
      .getElementById("employeeEmail")
      .value
      .trim();

  const name =
    document
      .getElementById("employeeName")
      .value
      .trim();

  const message =
    document
      .getElementById("problemMessage")
      .value
      .trim();

  const status =
    document
      .getElementById("modalStatus");

  if (
    !email ||
    !email.toLowerCase().endsWith("@norlys.dk")
  ) {

    status.textContent =
      currentLanguage === "da"
        ? "Brug din Norlys-e-mail."
        : "Use your Norlys email.";

    return;
  }

  if (!name) {

    status.textContent =
      currentLanguage === "da"
        ? "Indtast dit fulde navn."
        : "Enter your full name.";

    return;
  }

  if (
    requestType === "Fejlmelding" &&
    !message
  ) {

    status.textContent =
      currentLanguage === "da"
        ? "Beskriv venligst problemet."
        : "Please describe the problem.";

    return;
  }

  status.textContent =
    currentLanguage === "da"
      ? "Kontrollerer skabet..."
      : "Checking locker...";

  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/submit_locker_request`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          },

          body: JSON.stringify({

            p_locker_number:
              selectedLocker,

            p_employee_email:
              email,

            p_employee_name:
              name,

            p_request_type:
              requestType,

            p_message:
              message || null
          })
        }
      );

    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        `Fejl ${response.status}: ${errorText}`
      );
    }

    status.innerHTML =
      currentLanguage === "da"
        ? "✅ Anmodningen er sendt."
        : "✅ Request sent.";

    setTimeout(
      closeModal,
      1500
    );

  } catch (error) {

    status.textContent =
      error.message;
  }
}


setLanguage(currentLanguage);

</script>

</body>
</html>
