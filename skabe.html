<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vælg et skab</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .floor {
      background: white;
      max-width: 1000px;
      margin: 0 auto 30px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .floor h2 {
      margin-top: 0;
      font-size: 26px;
    }

    .lockers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .locker {
      width: 75px;
      height: 55px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 15px;
    }

    .available {
      background: #22c55e;
      cursor: pointer;
    }

    .occupied {
      background: #ef4444;
      cursor: not-allowed;
    }

    .status {
      margin-top: 25px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>Vælg et skab</h1>

  <div id="lockers">
    Indlæser skabe...
  </div>

  <div class="status" id="status"></div>

<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XU7y4WVGX4Osj7ixgRIfDA_mHpJ1ttv";

async function loadLockers() {

  const container = document.getElementById("lockers");
  const status = document.getElementById("status");

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/lockers?select=locker_number,floor,status`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {

      const errorText = await response.text();

      container.innerHTML = "";

      status.innerHTML =
        `<strong>Fejl ${response.status}</strong><br><br>${errorText}`;

      return;
    }

    const data = await response.json();

    /*
      Sorterer alle skabe numerisk.

      Det betyder f.eks.:

      0.007
      0.008
      0.009
      ...
      0.184
      1.001
      ...
      2.208
      ...
      3.256
    */

    data.sort((a, b) =>
      a.locker_number.localeCompare(
        b.locker_number,
        undefined,
        { numeric: true }
      )
    );

    container.innerHTML = "";

    const floors = {
      0: "Stuen",
      1: "Etage 1",
      2: "Etage 2",
      3: "Etage 3"
    };

    for (let floor = 0; floor <= 3; floor++) {

      const floorLockers = data.filter(
        locker => locker.floor === floor
      );

      if (floorLockers.length === 0) {
        continue;
      }

      const floorDiv = document.createElement("div");
      floorDiv.className = "floor";

      const title = document.createElement("h2");
      title.textContent = floors[floor];

      floorDiv.appendChild(title);

      const lockersDiv = document.createElement("div");
      lockersDiv.className = "lockers";

      floorLockers.forEach(locker => {

        const lockerDiv = document.createElement("div");

        lockerDiv.className =
          "locker " +
          (locker.status === "available"
            ? "available"
            : "occupied");

        lockerDiv.textContent = locker.locker_number;

        if (locker.status === "available") {

          lockerDiv.onclick = function() {

            window.location.href =
              `registrer.html?locker=${encodeURIComponent(
                locker.locker_number
              )}`;

          };

        }

        lockersDiv.appendChild(lockerDiv);

      });

      floorDiv.appendChild(lockersDiv);
      container.appendChild(floorDiv);
    }

    status.textContent =
      "Grøn = ledigt · Rød = optaget";

  } catch (error) {

    container.innerHTML = "";

    status.innerHTML =
      "<strong>Der opstod en fejl.</strong><br><br>" +
      error.message;
  }
}

loadLockers();

</script>

</body>
</html>
