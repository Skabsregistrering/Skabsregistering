<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vælg skab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      color: #222;
    }

    header {
      background: #17251d;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .floor {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .floor h2 {
      margin-top: 0;
      text-align: center;
    }

    .lockers {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
    }

    .locker {
      padding: 14px 5px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      color: white;
    }

    .available {
      background: #198754;
    }

    .occupied {
      background: #dc3545;
    }

    #message {
      text-align: center;
      font-size: 18px;
      margin: 30px 0;
    }
  </style>
</head>

<body>

<header>
  <h1>Vælg et skab</h1>
</header>

<main>

  <div id="message">Henter skabe...</div>

  <div id="lockerContainer"></div>

</main>

<script>
const SUPABASE_URL = "https://pwgwujojffxinfbqjlyb.supabase.co";
const SUPABASE_KEY = "sb_publishable_G7rR-9dHQEdLCLpysjNeKA_VHqhCsYz";

async function loadLockers() {
  const message = document.getElementById("message");
  const container = document.getElementById("lockerContainer");

  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/lockers?select=locker_number,floor,status&order=locker_number`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("Kunne ikke hente skabe");
    }

    const lockers = await response.json();

    if (!lockers.length) {
      message.textContent = "Ingen skabe fundet.";
      return;
    }

    message.textContent = "";

    const floors = {
      0: "Stuen",
      1: "1. sal",
      2: "2. sal",
      3: "3. sal"
    };

    const grouped = {};

    lockers.forEach(locker => {
      if (!grouped[locker.floor]) {
        grouped[locker.floor] = [];
      }

      grouped[locker.floor].push(locker);
    });

    Object.keys(grouped)
      .sort((a, b) => Number(a) - Number(b))
      .forEach(floor => {

        const floorDiv = document.createElement("div");
        floorDiv.className = "floor";

        const title = document.createElement("h2");
        title.textContent = floors[floor] || `Etage ${floor}`;

        const lockerGrid = document.createElement("div");
        lockerGrid.className = "lockers";

        grouped[floor].forEach(locker => {

          const lockerDiv = document.createElement("div");

          const isAvailable = locker.status === "available";

          lockerDiv.className =
            "locker " + (isAvailable ? "available" : "occupied");

          lockerDiv.textContent = locker.locker_number;

          lockerGrid.appendChild(lockerDiv);
        });

        floorDiv.appendChild(title);
        floorDiv.appendChild(lockerGrid);
        container.appendChild(floorDiv);
      });

  } catch (error) {
    message.textContent = "Der kunne ikke hentes skabe.";
    console.error(error);
  }
}

loadLockers();
</script>

</body>
</html>
