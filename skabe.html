<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledige skabe</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .info {
      text-align: center;
      margin-bottom: 25px;
      color: #555;
    }

    .floor {
      background: white;
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 12px;
    }

    .floor h2 {
      margin-top: 0;
    }

    .lockers {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }

    .locker {
      padding: 15px 5px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
    }

    .available {
      background: #d1fae5;
      color: #065f46;
    }

    .occupied {
      background: #fee2e2;
      color: #991b1b;
      cursor: not-allowed;
    }

    .status {
      font-size: 12px;
      font-weight: normal;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<h1>Skabsregistrering</h1>

<div class="info">
  Vælg et ledigt skab
</div>

<div id="lockers">Henter skabe...</div>

<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_G7rR-9dHQLEdCLpysjNeKA_VHqhCsYz";

async function loadLockers() {

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/lockers?select=locker_number,floor,status,qr_token&order=locker_number",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  const lockers = await response.json();

  const container = document.getElementById("lockers");
  container.innerHTML = "";

  const floors = {};

  lockers.forEach(locker => {
    if (!floors[locker.floor]) {
      floors[locker.floor] = [];
    }

    floors[locker.floor].push(locker);
  });

  Object.keys(floors)
    .sort()
    .forEach(floor => {

      const floorDiv = document.createElement("div");
      floorDiv.className = "floor";

      const title = document.createElement("h2");

      title.textContent =
        floor == 0 ? "Stuen" : "Etage " + floor;

      floorDiv.appendChild(title);

      const lockerGrid = document.createElement("div");
      lockerGrid.className = "lockers";

      floors[floor].forEach(locker => {

        const box = document.createElement("div");
        box.className = "locker " +
          (locker.status === "available"
            ? "available"
            : "occupied");

        box.innerHTML =
          "SKAB " + locker.locker_number +
          '<div class="status">' +
          (locker.status === "available"
            ? "Ledigt"
            : "Optaget") +
          "</div>";

        if (locker.status === "available") {

          box.onclick = function() {

            window.location.href =
              "index.html?token=" +
              encodeURIComponent(locker.qr_token);

          };

        }

        lockerGrid.appendChild(box);

      });

      floorDiv.appendChild(lockerGrid);
      container.appendChild(floorDiv);

    });
}

loadLockers();

</script>

</body>
</html>
