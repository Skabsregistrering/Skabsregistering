
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vælg et skab</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .language {
      text-align: right;
      max-width: 1000px;
      margin: 0 auto 10px;
    }

    .language button {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-weight: bold;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .floor {
      background: white;
      max-width: 1000px;
      margin: 0 auto 30px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    .floor h2 {
      margin-top: 0;
      font-size: 26px;
    }

    .lockers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .locker {
      width: 75px;
      height: 55px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 15px;
    }

    .available {
      background: #22c55e;
      cursor: pointer;
    }

    .available:hover {
      background: #16a34a;
    }

    .occupied {
      background: #ef4444;
      cursor: not-allowed;
    }

    .defect {
      background: #eab308;
      cursor: not-allowed;
    }

    .legend {
      margin: 20px auto 30px;
      font-size: 16px;
    }

    .legend span {
      display: inline-block;
      margin: 5px 10px;
      font-weight: bold;
    }

    .status {
      margin: 25px auto;
      font-size: 16px;
      max-width: 1000px;
    }

    .request-section {
      display: none;
      max-width: 600px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      text-align: left;
    }

    .request-section h2 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .action-button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .fault-button {
      background: #f59e0b;
    }

    .hint {
      color: #555;
      font-size: 14px;
      line-height: 1.45;
    }

    .request-status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 27px;
      }

      .floor {
        padding: 14px;
      }

      .locker {
        width: 66px;
        height: 50px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="language">
    <button onclick="setLanguage('da')">🇩🇰 Dansk</button>
    <button onclick="setLanguage('en')">🇬🇧 English</button>
  </div>

  <h1 id="pageTitle">Vælg et skab</h1>

  <div class="legend">
    <span id="availableText">🟢 Ledigt</span>
    <span id="occupiedText">🔴 Optaget</span>
    <span id="defectText">🟡 Defekt</span>
  </div>

  <div id="lockers">Indlæser skabe...</div>

  <div class="status" id="status"></div>

  <section class="request-section" id="requestSection">

    <h2 id="requestTitle">Fejlmelding eller anmodning</h2>

    <p class="hint" id="requestHint">
      Indsend en fejlmelding eller anmodning.
      Admin kontrollerer oplysningerne, før der foretages ændringer.
    </p>

    <label for="requestLocker" id="lockerLabel">
      Skabsnummer
    </label>

    <input
      id="requestLocker"
      type="text"
      inputmode="decimal"
      placeholder="Fx 2.208"
      maxlength="10"
    >

    <label for="employeeName" id="nameLabel">
      Fulde navn
    </label>

    <input
      type="text"
      id="employeeName"
      placeholder="Fornavn Efternavn"
      maxlength="150"
      autocomplete="name"
    >

    <label for="requestType" id="requestTypeLabel">
      Hvad ønsker du?
    </label>

    <select id="requestType">
      <option value="fault" id="faultOption">
        Fejlmeld skab
      </option>

      <option value="reset" id="resetOption">
        Anmod om nulstilling
      </option>
    </select>

    <label for="problemMessage" id="problemLabel">
      Beskrivelse (kun ved fejlmelding)
    </label>

    <textarea
      id="problemMessage"
      placeholder="Beskriv problemet..."
      maxlength="2000"
    ></textarea>

    <button
      class="action-button fault-button"
      onclick="sendRequest()"
      id="sendButton"
    >
      Send anmodning
    </button>

    <div class="request-status" id="requestStatus"></div>

  </section>

<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XU7y4WVGX4Osj7ixgRIfDA_mHpJ1ttv";

let currentLanguage =
  localStorage.getItem("lockerLanguage") || "da";


const translations = {

  da: {
    title: "Vælg et skab",
    available: "🟢 Ledigt",
    occupied: "🔴 Optaget",
    defect: "🟡 Defekt",

    ground: "Stuen",
    floor1: "Etage 1",
    floor2: "Etage 2",
    floor3: "Etage 3",

    loading: "Indlæser skabe...",
    status: "Grøn = ledigt · Rød = optaget · Gul = defekt",

    requestTitle: "Fejlmelding eller anmodning",

    requestHint:
      "Indsend en fejlmelding eller anmodning. Admin kontrollerer oplysningerne, før der foretages ændringer.",

    locker: "Skabsnummer",
    name: "Fulde navn",
    requestType: "Hvad ønsker du?",

    faultOption: "Fejlmeld skab",
    resetOption: "Anmod om nulstilling",

    problem: "Beskrivelse (kun ved fejlmelding)",

    send: "Send anmodning",

    lockerError: "Indtast skabsnummeret.",
    nameError: "Indtast dit fulde navn.",
    messageError: "Beskriv venligst problemet.",

    sending: "Sender anmodning...",

    sent:
      "✅ Anmodningen er sendt til admin og afventer kontrol.",

    error: "Der opstod en fejl."
  },

  en: {
    title: "Choose a locker",
    available: "🟢 Available",
    occupied: "🔴 Occupied",
    defect: "🟡 Defective",

    ground: "Ground floor",
    floor1: "1st floor",
    floor2: "2nd floor",
    floor3: "3rd floor",

    loading: "Loading lockers...",
    status: "Green = available · Red = occupied · Yellow = defective",

    requestTitle: "Problem report or request",

    requestHint:
      "Submit a problem report or request. Admin will verify the information before making changes.",

    locker: "Locker number",
    name: "Full name",
    requestType: "What do you need?",

    faultOption: "Report a problem",
    resetOption: "Request a reset",

    problem: "Description (for problem reports only)",

    send: "Send request",

    lockerError: "Enter the locker number.",
    nameError: "Enter your full name.",
    messageError: "Please describe the problem.",

    sending: "Sending request...",

    sent:
      "✅ Request sent to admin and awaiting review.",

    error: "An error occurred."
  }

};


/* SPROG */

function setLanguage(language) {

  currentLanguage = language;

  localStorage.setItem("lockerLanguage", language);

  const t = translations[language];

  document.documentElement.lang = language;

  document.getElementById("pageTitle").textContent = t.title;

  document.getElementById("availableText").textContent = t.available;
  document.getElementById("occupiedText").textContent = t.occupied;
  document.getElementById("defectText").textContent = t.defect;

  document.getElementById("requestTitle").textContent = t.requestTitle;
  document.getElementById("requestHint").textContent = t.requestHint;

  document.getElementById("lockerLabel").textContent = t.locker;
  document.getElementById("nameLabel").textContent = t.name;

  document.getElementById("requestTypeLabel").textContent = t.requestType;

  document.getElementById("faultOption").textContent = t.faultOption;
  document.getElementById("resetOption").textContent = t.resetOption;

  document.getElementById("problemLabel").textContent = t.problem;

  document.getElementById("sendButton").textContent = t.send;

  document.getElementById("status").textContent = t.status;

  loadLockers();
}


/* HENT SKABE */

async function loadLockers() {

  const container =
    document.getElementById("lockers");

  const status =
    document.getElementById("status");

  const t = translations[currentLanguage];

  container.textContent = t.loading;

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/lockers?select=locker_number,floor,status,defect`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {

      const errorText = await response.text();

      container.innerHTML = "";

      status.textContent =
        `Fejl ${response.status}: ${errorText}`;

      return;
    }

    const data = await response.json();

    data.sort((a, b) =>
      String(a.locker_number).localeCompare(
        String(b.locker_number),
        undefined,
        { numeric: true }
      )
    );

    container.innerHTML = "";

    const floors = {
      0: t.ground,
      1: t.floor1,
      2: t.floor2,
      3: t.floor3
    };

    for (let floor = 0; floor <= 3; floor++) {

      const floorLockers = data.filter(
        locker => Number(locker.floor) === floor
      );

      if (!floorLockers.length) continue;

      const floorDiv = document.createElement("div");

      floorDiv.className = "floor";

      const title = document.createElement("h2");

      title.textContent =
        floors[floor] || `Etage ${floor}`;

      floorDiv.appendChild(title);

      const lockersDiv = document.createElement("div");

      lockersDiv.className = "lockers";

      floorLockers.forEach(locker => {

        const lockerDiv = document.createElement("div");

        let lockerClass = "occupied";

        if (locker.defect === true) {

          lockerClass = "defect";

        } else if (locker.status === "available") {

          lockerClass = "available";

        } else if (locker.status === "occupied") {

          lockerClass = "occupied";

        }

        lockerDiv.className =
          `locker ${lockerClass}`;

        lockerDiv.textContent =
          locker.locker_number;

        // Kun ledige skabe kan vælges til registrering.
        // Optagede og defekte skabe kan ikke ændres her.

        if (
          locker.status === "available" &&
          locker.defect !== true
        ) {

          lockerDiv.onclick = () => {

            window.location.href =
              `registrer.html?locker=${encodeURIComponent(
                locker.locker_number
              )}`;

          };

          lockerDiv.title =
            currentLanguage === "da"
              ? "Vælg dette ledige skab"
              : "Choose this available locker";

        } else {

          lockerDiv.setAttribute(
            "aria-disabled",
            "true"
          );

        }

        lockersDiv.appendChild(lockerDiv);

      });

      floorDiv.appendChild(lockersDiv);

      container.appendChild(floorDiv);

    }

    document.getElementById("requestSection").style.display =
      "block";

    status.textContent = t.status;

  } catch (error) {

    container.innerHTML = "";

    status.textContent =
      `${t.error} ${error.message}`;

  }

}


/* SEND ANMODNING TIL ADMIN */

async function sendRequest() {

  const lockerNumber =
    document.getElementById("requestLocker").value.trim();

  const name =
    document.getElementById("employeeName").value.trim();

  const requestType =
    document.getElementById("requestType").value;

  const message =
    document.getElementById("problemMessage").value.trim();

  const status =
    document.getElementById("requestStatus");

  const sendButton =
    document.getElementById("sendButton");

  const t = translations[currentLanguage];


  if (!lockerNumber) {

    status.textContent = t.lockerError;
    return;

  }

  if (!name) {

    status.textContent = t.nameError;
    return;

  }

  if (requestType === "fault" && !message) {

    status.textContent = t.messageError;
    return;

  }


  status.textContent = t.sending;

  sendButton.disabled = true;


  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/submit_locker_request`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        },

        body: JSON.stringify({

          p_locker_number: lockerNumber,

          p_employee_email: null,

          p_employee_name: name,

          p_request_type: requestType,

          p_message: message || null

        })
      }
    );


    if (!response.ok) {

      const errorText = await response.text();

      throw new Error(
        `Fejl ${response.status}: ${errorText}`
      );

    }


    const result = await response.json();

    if (!result || result.success !== true) {

      throw new Error(
        result?.message || t.error
      );

    }


    status.textContent = t.sent;

    document.getElementById("requestLocker").value = "";

    document.getElementById("employeeName").value = "";

    document.getElementById("problemMessage").value = "";


  } catch (error) {

    status.textContent =
      error.message || t.error;

  } finally {

    sendButton.disabled = false;

  }

}


/* BESKRIVELSE KUN VED FEJLMELDING */

document
  .getElementById("requestType")
  .addEventListener("change", () => {

    const isFault =
      document.getElementById("requestType").value === "fault";

    const messageField =
      document.getElementById("problemMessage");

    messageField.disabled = !isFault;

    if (!isFault) {

      messageField.value = "";

    }

  });


/* START */

setLanguage(currentLanguage);

</script>

</body>
</html>
