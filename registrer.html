<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registrer skab</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px 20px;
    }

    .box {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .locker {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin: 25px 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .problem-button {
      background: #f59e0b;
    }

    .send-button {
      background: #2563eb;
    }

    .cancel-button {
      background: #777;
    }

    .hidden {
      display: none;
    }

    #status,
    #problemStatus {
      text-align: center;
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Registrer skab</h1>

  <div class="locker" id="locker">
    Indlæser...
  </div>

  <div id="registrationForm">

    <label for="email">Norlys-e-mail</label>

    <input
      type="email"
      id="email"
      placeholder="navn@norlys.dk"
      autocomplete="email"
    >

    <label for="name">Fulde navn</label>

    <input
      type="text"
      id="name"
      placeholder="Fornavn Efternavn"
      autocomplete="name"
    >

    <label for="lockerCode">4-cifret kode til skabet</label>

    <input
      type="password"
      id="lockerCode"
      placeholder="••••"
      inputmode="numeric"
      maxlength="4"
      autocomplete="off"
    >

    <button id="registerButton" onclick="registerLocker()">
      Registrer skab
    </button>

  </div>

  <div id="status"></div>


  <div id="problemSection" class="hidden">

    <button
      class="problem-button"
      onclick="showProblemForm()"
    >
      🔧 Fejlmeld mit skab
    </button>

  </div>


  <div id="problemForm" class="hidden">

    <label for="problemMessage">
      Hvad er problemet med skabet?
    </label>

    <textarea
      id="problemMessage"
      placeholder="Beskriv problemet..."
    ></textarea>

    <button
      class="send-button"
      id="sendProblemButton"
      onclick="sendProblemReport()"
    >
      Send fejlmelding
    </button>

    <button
      class="cancel-button"
      onclick="hideProblemForm()"
    >
      Annuller
    </button>

    <div id="problemStatus"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XU7y4WVGX4Osj7ixgRIfDA_mHpJ1ttv";


const params =
  new URLSearchParams(window.location.search);

const lockerNumber =
  params.get("locker");


let registeredEmail = "";
let registeredName = "";


document.getElementById("locker").textContent =
  lockerNumber
    ? "Skab " + lockerNumber
    : "Intet skab valgt";


document
  .getElementById("lockerCode")
  .addEventListener("input", function() {

    this.value =
      this.value
        .replace(/\D/g, "")
        .slice(0, 4);

  });


async function registerLocker() {

  const email =
    document.getElementById("email").value.trim();

  const name =
    document.getElementById("name").value.trim();

  const lockerCode =
    document.getElementById("lockerCode").value.trim();

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("registerButton");


  if (!lockerNumber) {

    status.innerHTML =
      "<strong>Fejl:</strong> Intet skab valgt.";

    return;
  }


  if (
    !email ||
    !email.toLowerCase().endsWith("@norlys.dk")
  ) {

    status.innerHTML =
      "<strong>Brug din Norlys-e-mail.</strong>";

    return;
  }


  if (!name) {

    status.innerHTML =
      "<strong>Indtast dit fulde navn.</strong>";

    return;
  }


  if (!/^\d{4}$/.test(lockerCode)) {

    status.innerHTML =
      "<strong>Koden skal være præcis 4 cifre.</strong>";

    return;
  }


  button.disabled = true;
  button.textContent = "Registrerer...";
  status.textContent = "";


  try {

    const lockerResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/lockers?locker_number=eq.${encodeURIComponent(lockerNumber)}&select=qr_token,status,defect`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );


    if (!lockerResponse.ok) {

      throw new Error(
        "Kunne ikke hente skabet."
      );

    }


    const lockers =
      await lockerResponse.json();


    if (lockers.length === 0) {

      throw new Error(
        "Skabet findes ikke."
      );

    }


    const locker =
      lockers[0];


    if (locker.defect === true) {

      throw new Error(
        "Dette skab er markeret som defekt."
      );

    }


    if (locker.status !== "available") {

      throw new Error(
        "Dette skab er allerede optaget."
      );

    }


    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/claim_locker`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        },

        body: JSON.stringify({

          p_qr_token:
            locker.qr_token,

          p_employee_id:
            email,

          p_name:
            name,

          p_locker_code:
            lockerCode

        })
      }
    );


    const resultText =
      await response.text();


    if (!response.ok) {

      throw new Error(
        `Fejl ${response.status}: ${resultText}`
      );

    }


    registeredEmail = email;
    registeredName = name;


    document
      .getElementById("registrationForm")
      .classList.add("hidden");


    status.innerHTML =
      "<strong>Skabet er registreret.</strong><br><br>" +
      "Skab " +
      lockerNumber +
      " er nu registreret til " +
      name +
      ".";


    document
      .getElementById("problemSection")
      .classList.remove("hidden");


  } catch (error) {

    status.innerHTML =
      "<strong>Der opstod en fejl.</strong><br><br>" +
      error.message;


    button.disabled = false;
    button.textContent =
      "Registrer skab";

  }

}


function showProblemForm() {

  document
    .getElementById("problemSection")
    .classList.add("hidden");

  document
    .getElementById("problemForm")
    .classList.remove("hidden");

}


function hideProblemForm() {

  document
    .getElementById("problemForm")
    .classList.add("hidden");

  document
    .getElementById("problemSection")
    .classList.remove("hidden");

}


async function sendProblemReport() {

  const message =
    document
      .getElementById("problemMessage")
      .value
      .trim();

  const status =
    document.getElementById("problemStatus");

  const button =
    document.getElementById("sendProblemButton");


  if (!message) {

    status.innerHTML =
      "<strong>Beskriv venligst problemet.</strong>";

    return;
  }


  button.disabled = true;
  button.textContent =
    "Sender...";

  status.textContent = "";


  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/locker_requests`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({

          locker_number:
            lockerNumber,

          employee_name:
            registeredName,

          employee_email:
            registeredEmail,

          request_type:
            "Fejlmelding",

          message:
            message,

          status:
            "open"

        })
      }
    );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        `Fejl ${response.status}: ${errorText}`
      );

    }


    status.innerHTML =
      "<strong>Fejlmeldingen er sendt.</strong><br><br>" +
      "Admin kan nu se problemet og behandle det.";


    button.textContent =
      "Sendt";

    document
      .getElementById("problemMessage")
      .disabled = true;


  } catch (error) {

    status.innerHTML =
      "<strong>Der opstod en fejl.</strong><br><br>" +
      error.message;

    button.disabled = false;
    button.textContent =
      "Send fejlmelding";

  }

}

</script>

</body>
</html>
