<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registrer skab</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .language {
      max-width: 500px;
      margin: 0 auto 10px auto;
      text-align: right;
    }

    .language button {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-weight: bold;
    }

    .box {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .locker {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin: 25px 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: Arial, sans-serif;
    }

    button.main-button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      background: #999 !important;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    #status {
      text-align: center;
      margin-top: 20px;
      font-size: 16px;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }
  </style>
</head>

<body>

<div class="language">
  <button onclick="setLanguage('da')">🇩🇰 Dansk</button>
  <button onclick="setLanguage('en')">🇬🇧 English</button>
</div>

<div class="box">

  <h1 id="pageTitle">Registrer skab</h1>

  <div class="locker" id="locker">
    Indlæser...
  </div>

  <div id="registrationForm">

    <div id="employeeFields">

      <label for="email" id="emailLabel">
        Norlys-e-mail
      </label>

      <input
        type="email"
        id="email"
        placeholder="navn@norlys.dk"
        autocomplete="email"
      >

      <label for="name" id="nameLabel">
        Fulde navn
      </label>

      <input
        type="text"
        id="name"
        placeholder="Fornavn Efternavn"
        autocomplete="name"
      >

      <label for="lockerCode" id="lockerCodeLabel">
        4-cifret kode til skabet
      </label>

      <input
        type="password"
        id="lockerCode"
        placeholder="••••"
        inputmode="numeric"
        maxlength="4"
        autocomplete="off"
      >

    </div>

    <button
      class="main-button"
      id="registerButton"
      onclick="registerLocker()"
    >
      Registrer skab
    </button>

  </div>

  <div id="status"></div>

</div>


<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XU7y4WVGX4Osj7ixgRIfDA_mHpJ1ttv";


const params =
  new URLSearchParams(window.location.search);

const lockerNumber =
  params.get("locker");


let currentLanguage =
  localStorage.getItem("lockerLanguage") || "da";


const translations = {

  da: {

    title: "Registrer skab",

    locker: "Skab",

    noLocker: "Intet skab valgt.",

    email: "Norlys-e-mail",

    emailPlaceholder: "navn@norlys.dk",

    name: "Fulde navn",

    namePlaceholder: "Fornavn Efternavn",

    code: "4-cifret kode til skabet",

    register: "Registrer skab",

    registering: "Registrerer...",

    useNorlys: "Brug din Norlys-e-mail.",

    enterName: "Indtast dit fulde navn.",

    codeError: "Koden skal være præcis 4 cifre.",

    lockerNotFound: "Skabet findes ikke.",

    defect: "Dette skab er markeret som defekt.",

    occupied: "Dette skab er allerede optaget.",

    success: "Skabet er registreret.",

    registeredTo: "er nu registreret til",

    error: "Der opstod en fejl."

  },


  en: {

    title: "Register locker",

    locker: "Locker",

    noLocker: "No locker selected.",

    email: "Norlys email",

    emailPlaceholder: "name@norlys.dk",

    name: "Full name",

    namePlaceholder: "First name Last name",

    code: "4-digit locker code",

    register: "Register locker",

    registering: "Registering...",

    useNorlys: "Please use your Norlys email.",

    enterName: "Please enter your full name.",

    codeError: "The code must contain exactly 4 digits.",

    lockerNotFound: "The locker does not exist.",

    defect: "This locker is marked as defective.",

    occupied: "This locker is already occupied.",

    success: "The locker has been registered.",

    registeredTo: "is now registered to",

    error: "An error occurred."

  }

};


function setLanguage(language) {

  currentLanguage =
    language;

  localStorage.setItem(
    "lockerLanguage",
    language
  );

  const t =
    translations[language];

  document.documentElement.lang =
    language;

  document.getElementById("pageTitle").textContent =
    t.title;

  document.getElementById("emailLabel").textContent =
    t.email;

  document.getElementById("email").placeholder =
    t.emailPlaceholder;

  document.getElementById("nameLabel").textContent =
    t.name;

  document.getElementById("name").placeholder =
    t.namePlaceholder;

  document.getElementById("lockerCodeLabel").textContent =
    t.code;

  document.getElementById("registerButton").textContent =
    t.register;

  document.getElementById("locker").textContent =
    lockerNumber
      ? t.locker + " " + lockerNumber
      : t.noLocker;

}


function setupPage() {

  if (!lockerNumber) {

    document.getElementById("locker").textContent =
      translations[currentLanguage].noLocker;

    document.getElementById("registrationForm").classList.add("hidden");

    return;
  }

}


document
  .getElementById("lockerCode")
  .addEventListener(
    "input",
    function() {

      this.value =
        this.value
          .replace(/\D/g, "")
          .slice(0, 4);

    }
  );


async function registerLocker() {

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("registerButton");

  const t =
    translations[currentLanguage];


  if (!lockerNumber) {

    status.innerHTML =
      `<strong>${t.noLocker}</strong>`;

    return;
  }


  button.disabled = true;

  button.textContent =
    t.registering;

  status.textContent = "";


  try {

    /*
     * HENT SKAB
     */

    const lockerResponse =
      await fetch(
        `${SUPABASE_URL}/rest/v1/lockers?locker_number=eq.${encodeURIComponent(lockerNumber)}&select=id,qr_token,status,defect`,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              `Bearer ${SUPABASE_KEY}`
          }
        }
      );


    if (!lockerResponse.ok) {

      throw new Error(
        t.lockerNotFound
      );

    }


    const lockers =
      await lockerResponse.json();


    if (lockers.length === 0) {

      throw new Error(
        t.lockerNotFound
      );

    }


    const locker =
      lockers[0];


    if (locker.defect === true) {

      throw new Error(
        t.defect
      );

    }


    if (locker.status !== "available") {

      throw new Error(
        t.occupied
      );

    }


    /*
     * NORMAL MEDARBEJDER
     */

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const name =
      document
        .getElementById("name")
        .value
        .trim();

    const lockerCode =
      document
        .getElementById("lockerCode")
        .value
        .trim();


    if (
      !email ||
      !email
        .toLowerCase()
        .endsWith("@norlys.dk")
    ) {

      throw new Error(
        t.useNorlys
      );

    }


    if (!name) {

      throw new Error(
        t.enterName
      );

    }


    if (!/^\d{4}$/.test(lockerCode)) {

      throw new Error(
        t.codeError
      );

    }


    /*
     * REGISTRER MEDARBEJDEREN
     */

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/claim_locker`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${SUPABASE_KEY}`
          },

          body: JSON.stringify({

            p_employee_id:
              email,

            p_locker_code:
              lockerCode,

            p_name:
              name,

            p_qr_token:
              locker.qr_token

          })
        }
      );


    const resultText =
      await response.text();


    if (!response.ok) {

      throw new Error(
        `Fejl ${response.status}: ${resultText}`
      );

    }


    document
      .getElementById("registrationForm")
      .classList.add("hidden");


    status.className =
      "success";


    status.innerHTML =
      `<strong>${t.success}</strong>
      <br><br>
      ${t.locker} ${lockerNumber}
      ${t.registeredTo}
      ${name}.`;


  } catch (error) {

    status.className =
      "error";

    status.innerHTML =
      `<strong>${t.error}</strong>
      <br><br>
      ${error.message}`;


    button.disabled =
      false;

    button.textContent =
      t.register;

  }

}


setupPage();

setLanguage(
  currentLanguage
);

</script>

</body>
</html>
