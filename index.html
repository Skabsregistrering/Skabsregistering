<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skabsregistrering</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    .locker {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    .message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Skabsregistrering</h1>

  <div id="loading">Henter skab...</div>

  <div id="content" style="display:none;">

    <div class="locker">
      Skab <span id="lockerNumber"></span>
    </div>

    <div id="availableForm">

      <label for="employeeId">Medarbejder-ID</label>
      <input
        id="employeeId"
        type="text"
        placeholder="Indtast medarbejder-ID"
      >

      <label for="employeeName">Navn</label>
      <input
        id="employeeName"
        type="text"
        placeholder="Indtast navn"
      >

      <button id="registerButton" onclick="registerLocker()">
        Registrér skab
      </button>

    </div>

    <div id="message" class="message"></div>

  </div>
</div>

<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_G7rR-9dHQLEdCLpysjNeKA_VHqhCsYz";

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

const loading = document.getElementById("loading");
const content = document.getElementById("content");
const lockerNumber = document.getElementById("lockerNumber");
const availableForm = document.getElementById("availableForm");
const message = document.getElementById("message");

async function loadLocker() {

  if (!token) {
    loading.innerText = "QR-koden mangler.";
    return;
  }

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/lockers?qr_token=eq.${encodeURIComponent(token)}&select=id,locker_number,floor,status`
      , {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("Kunne ikke hente skab.");
    }

    const lockers = await response.json();

    if (!lockers.length) {
      loading.innerText = "Skabet blev ikke fundet.";
      return;
    }

    const locker = lockers[0];

    lockerNumber.innerText = locker.locker_number;

    loading.style.display = "none";
    content.style.display = "block";

    if (locker.status !== "available") {

      availableForm.style.display = "none";

      message.innerText =
        "Dette skab er allerede optaget.";

    }

    window.currentLocker = locker;

  } catch (error) {

    loading.innerText =
      "Der opstod en fejl. Prøv igen.";

    console.error(error);
  }
}


async function registerLocker() {

  const employeeId =
    document.getElementById("employeeId").value.trim();

  const employeeName =
    document.getElementById("employeeName").value.trim();

  const button =
    document.getElementById("registerButton");

  if (!employeeId || !employeeName) {

    message.innerText =
      "Udfyld både medarbejder-ID og navn.";

    return;
  }

  button.disabled = true;
  button.innerText = "Registrerer...";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/claim_locker`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        },

        body: JSON.stringify({
          p_qr_token: token,
          p_employee_id: employeeId,
          p_name: employeeName
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.message ||
        result.error ||
        "Registreringen fejlede."
      );
    }

    if (result.success) {

      availableForm.style.display = "none";

      message.innerText =
        `Skab ${result.locker_number} er nu registreret til ${employeeName}.`;

    } else {

      message.innerText =
        result.error || "Registreringen fejlede.";

      button.disabled = false;
      button.innerText = "Registrér skab";
    }

  } catch (error) {

    console.error(error);

    message.innerText =
      "Der opstod en fejl. Prøv igen.";

    button.disabled = false;
    button.innerText = "Registrér skab";
  }
}


loadLocker();

</script>

</body>
</html>
