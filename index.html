<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skabsregistrering</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      color: #222;
    }

    header {
      background: #17251d;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    main {
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .locker {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 17px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #198754;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #157347;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-size: 17px;
      font-weight: bold;
    }

    .success {
      color: #198754;
    }

    .error {
      color: #dc3545;
    }
  </style>
</head>

<body>

<header>
  <h1>Skabsregistrering</h1>
</header>

<main>
  <div class="card">

    <div class="locker" id="locker">
      Henter skab...
    </div>

    <label for="employeeId">Medarbejder-ID</label>
    <input id="employeeId" type="text" placeholder="Indtast medarbejder-ID">

    <label for="name">Navn</label>
    <input id="name" type="text" placeholder="Indtast navn">

    <button onclick="registerLocker()">Registrér skab</button>

    <div id="message"></div>

  </div>
</main>

<script>
const SUPABASE_URL = "https://pwgwujojffxinfbqjlyb.supabase.co";
const SUPABASE_KEY = "sb_publishable_G7rR-9dHQEdLCLpysjNeKA_VHqhCsYz";

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

let lockerNumber = null;

async function loadLocker() {
  if (!token) {
    document.getElementById("locker").textContent = "Intet skab valgt";
    return;
  }

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/lockers?qr_token=eq.${encodeURIComponent(token)}&select=locker_number,status`,
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    }
  );

  const data = await response.json();

  if (!data.length) {
    document.getElementById("locker").textContent = "Skab ikke fundet";
    return;
  }

  lockerNumber = data[0].locker_number;

  document.getElementById("locker").textContent =
    `Skab ${lockerNumber}`;

  if (data[0].status !== "available") {
    document.getElementById("locker").textContent =
      `Skab ${lockerNumber} er optaget`;

    document.querySelector("button").disabled = true;
    document.querySelector("button").style.background = "#999";
  }
}

async function registerLocker() {
  const employeeId = document.getElementById("employeeId").value.trim();
  const name = document.getElementById("name").value.trim();
  const message = document.getElementById("message");

  if (!employeeId || !name) {
    message.className = "error";
    message.textContent = "Udfyld medarbejder-ID og navn.";
    return;
  }

  message.className = "";
  message.textContent = "Registrerer...";

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/rpc/claim_locker`,
    {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        p_qr_token: token,
        p_employee_id: employeeId,
        p_name: name
      })
    }
  );

  const result = await response.json();

  if (!response.ok || !result.success) {
    message.className = "error";
    message.textContent =
      "Skabet kunne ikke registreres. Det er muligvis allerede optaget.";
    return;
  }

  message.className = "success";
  message.textContent =
    `✓ Skab ${result.locker_number} er registreret til ${name}`;

  document.getElementById("employeeId").disabled = true;
  document.getElementById("name").disabled = true;
  document.querySelector("button").disabled = true;
  document.querySelector("button").style.background = "#999";
}

loadLocker();
</script>

</body>
</html>
