```html
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skabsregistrering</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 32px;
    }

    p {
      font-size: 20px;
    }

    #qrcode {
      margin: 30px auto;
    }

    #qrcode img {
      width: 400px;
      height: 400px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
    }

    @media print {
      button {
        display: none;
      }
    }
  </style>
</head>

<body>

  <h1>SKABSREGISTRERING</h1>

  <p>Scan QR-koden for at se og vælge et ledigt skab</p>

  <div id="qrcode"></div>

  <button onclick="window.print()">Print QR-kode</button>

  <script>
    const skabeUrl =
      window.location.origin +
      "/Skabsregistering/skabe.html";

    const qrUrl =
      "https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=" +
      encodeURIComponent(skabeUrl);

    const qr =
      document.createElement("img");

    qr.src = qrUrl;
    qr.alt = "QR-kode til skabsregistrering";

    document.getElementById("qrcode").appendChild(qr);
  </script>

</body>
</html>
```
