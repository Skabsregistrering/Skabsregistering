<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skabsregistrering</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 32px;
    }

    p {
      font-size: 20px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 30px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      margin: 5px;
    }

    .language {
      margin-bottom: 25px;
    }

    .language button {
      padding: 8px 16px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="language">
  <button onclick="setLanguage('da')">🇩🇰 Dansk</button>
  <button onclick="setLanguage('en')">🇬🇧 English</button>
</div>

<h1 id="title">SKABSREGISTRERING</h1>

<p id="description">Scan QR-koden for at se og vælge et ledigt skab</p>

<div id="qrcode"></div>

<button id="printButton" onclick="window.print()">Print QR-kode</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
const url = "https://skabsregistrering.github.io/Skabsregistering/skabe.html";

const translations = {
  da: {
    title: "SKABSREGISTRERING",
    description: "Scan QR-koden for at se og vælge et ledigt skab",
    print: "Print QR-kode"
  },
  en: {
    title: "LOCKER REGISTRATION",
    description: "Scan the QR code to view and select an available locker",
    print: "Print QR code"
  }
};

function setLanguage(language) {
  document.documentElement.lang = language;

  document.getElementById("title").textContent =
    translations[language].title;

  document.getElementById("description").textContent =
    translations[language].description;

  document.getElementById("printButton").textContent =
    translations[language].print;

  localStorage.setItem("lockerLanguage", language);
}

new QRCode(document.getElementById("qrcode"), {
  text: url,
  width: 400,
  height: 400
});

const savedLanguage = localStorage.getItem("lockerLanguage") || "da";
setLanguage(savedLanguage);
</script>

</body>
</html>
