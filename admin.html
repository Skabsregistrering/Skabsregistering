<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skabsregistrering – Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 1100px;
      margin: auto;
    }

    .login,
    .admin {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .login {
      max-width: 450px;
      margin: 50px auto;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }

    .login button {
      width: 100%;
      background: #2563eb;
      color: white;
    }

    .logout {
      background: #ef4444;
      color: white;
      float: right;
    }

    .floor {
      margin-top: 30px;
    }

    .locker {
      background: white;
      border-left: 8px solid #22c55e;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
    }

    .locker.occupied {
      border-left-color: #ef4444;
    }

    .release {
      background: #ef4444;
      color: white;
    }

    .error {
      color: #dc2626;
      margin-top: 15px;
    }

    .success {
      color: #16a34a;
      margin-top: 15px;
    }

    .clear {
      clear: both;
    }
  </style>
</head>

<body>

<div class="box">

  <div id="loginBox" class="login">

    <h1>Admin login</h1>

    <label for="email">E-mail</label>
    <input type="email" id="email">

    <label for="password">Password</label>
    <input type="password" id="password">

    <button id="loginButton">Log ind</button>

    <div id="loginStatus"></div>

  </div>


  <div id="adminBox" class="admin" style="display:none;">

    <button class="logout" id="logoutButton">Log ud</button>

    <h1>Skabsregistrering – Admin</h1>

    <div class="clear"></div>

    <div id="status"></div>

    <div id="lockers">
      Indlæser skabe...
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XU7y4WVGX4Osj7ixgRIfDA_mHpJ1ttv";

let accessToken = null;


/* LOGIN */

document.getElementById("loginButton").addEventListener("click", login);


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const loginStatus =
    document.getElementById("loginStatus");

  if (!email || !password) {

    loginStatus.innerHTML =
      '<div class="error">Indtast e-mail og password.</div>';

    return;
  }

  loginStatus.textContent = "Logger ind...";

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {

      throw new Error(
        data.error_description ||
        data.msg ||
        data.message ||
        "Login mislykkedes."
      );
    }

    accessToken = data.access_token;

    document.getElementById("loginBox").style.display = "none";

    document.getElementById("adminBox").style.display = "block";

    loadLockers();

  } catch (error) {

    loginStatus.innerHTML =
      '<div class="error">' +
      error.message +
      '</div>';
  }
}


/* HENT SKABE */

async function loadLockers() {

  const container =
    document.getElementById("lockers");

  const status =
    document.getElementById("status");

  container.innerHTML = "Indlæser skabe...";

  status.innerHTML = "";

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/lockers?select=locker_number,floor,status,employee_id,assigned_at&order=locker_number",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    const text = await response.text();

    if (!response.ok) {

      throw new Error(
        "Fejl " +
        response.status +
        ": " +
        text
      );
    }

    const lockers = JSON.parse(text);

    container.innerHTML = "";

    const floors = {
      0: "Stuen",
      1: "Etage 1",
      2: "Etage 2",
      3: "Etage 3"
    };

    for (let floor = 0; floor <= 3; floor++) {

      const floorLockers =
        lockers.filter(function(locker) {
          return Number(locker.floor) === floor;
        });

      if (floorLockers.length === 0) {
        continue;
      }

      const floorDiv =
        document.createElement("div");

      floorDiv.className = "floor";

      const title =
        document.createElement("h2");

      title.textContent = floors[floor];

      floorDiv.appendChild(title);


      floorLockers.forEach(function(locker) {

        const div =
          document.createElement("div");

        div.className = "locker";

        if (locker.status === "occupied") {
          div.classList.add("occupied");
        }

        let html =
          "<strong>Skab " +
          locker.locker_number +
          "</strong><br>";

        html +=
          "Status: " +
          locker.status +
          "<br>";

        if (locker.assigned_at) {

          html +=
            "Registreret: " +
            new Date(
              locker.assigned_at
            ).toLocaleString("da-DK") +
            "<br>";
        }

        if (locker.status === "occupied") {

          html +=
            '<button class="release" ' +
            'onclick="releaseLocker(\'' +
            locker.locker_number +
            '\')">' +
            'Frigiv skab' +
            '</button>';
        }

        div.innerHTML = html;

        floorDiv.appendChild(div);

      });

      container.appendChild(floorDiv);
    }

    status.innerHTML =
      '<div class="success">' +
      lockers.length +
      ' skabe indlæst.</div>';

  } catch (error) {

    container.innerHTML = "";

    status.innerHTML =
      '<div class="error">' +
      error.message +
      '</div>';
  }
}


/* FRIGIV SKAB */

async function releaseLocker(lockerNumber) {

  if (!confirm(
    "Vil du frigive skab " +
    lockerNumber +
    "?"
  )) {
    return;
  }

  const status =
    document.getElementById("status");

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/lockers?locker_number=eq." +
      encodeURIComponent(lockerNumber),
      {
        method: "PATCH",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({
          status: "available",
          employee_id: null,
          assigned_at: null
        })
      }
    );

    if (!response.ok) {

      const text =
        await response.text();

      throw new Error(
        "Fejl " +
        response.status +
        ": " +
        text
      );
    }

    status.innerHTML =
      '<div class="success">' +
      "Skab " +
      lockerNumber +
      " er frigivet." +
      "</div>";

    loadLockers();

  } catch (error) {

    status.innerHTML =
      '<div class="error">' +
      error.message +
      "</div>";
  }
}


/* LOG UD */

document
  .getElementById("logoutButton")
  .addEventListener("click", logout);


function logout() {

  accessToken = null;

  document.getElementById("adminBox").style.display = "none";

  document.getElementById("loginBox").style.display = "block";

  document.getElementById("password").value = "";

  document.getElementById("loginStatus").textContent = "";
}

</script>

</body>
</html>
