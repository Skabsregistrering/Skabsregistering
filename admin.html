<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin – Skabsregistrering</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    h2 {
      margin-top: 30px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .login-button {
      width: 100%;
      margin-top: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }

    .release-button {
      background: #ef4444;
      color: white;
      margin-top: 10px;
    }

    .complete-button {
      background: #22c55e;
      color: white;
      margin-top: 10px;
    }

    .logout-button {
      background: #555;
      color: white;
      float: right;
    }

    .floor {
      margin-top: 30px;
    }

    .locker {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      background: #fafafa;
    }

    .available {
      border-left: 6px solid #22c55e;
    }

    .occupied {
      border-left: 6px solid #ef4444;
    }

    .history {
      margin-top: 12px;
      border-top: 1px solid #ddd;
      padding-top: 8px;
    }

    .history summary {
      cursor: pointer;
      font-weight: bold;
    }

    .history-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .task {
      border: 1px solid #ddd;
      border-left: 6px solid #f59e0b;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      background: #fff;
    }

    .task.completed {
      border-left-color: #22c55e;
      opacity: 0.75;
    }

    .task-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .task-status-open {
      color: #dc2626;
      font-weight: bold;
    }

    .task-status-completed {
      color: #16a34a;
      font-weight: bold;
    }

    .error {
      color: #dc2626;
      margin-top: 10px;
    }

    .success {
      color: #16a34a;
      margin-top: 10px;
    }

    .task-status {
      margin-top: 20px;
      margin-bottom: 15px;
    }

    #adminContent {
      display: none;
    }
  </style>
</head>

<body>

<div class="box">

  <div id="loginBox">

    <h1>Admin login</h1>

    <input
      type="email"
      id="email"
      placeholder="E-mail"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Adgangskode"
      autocomplete="current-password"
    >

    <button class="login-button" id="loginButton">
      Log ind
    </button>

    <div id="loginStatus"></div>

  </div>


  <div id="adminContent">

    <button class="logout-button" id="logoutButton">
      Log ud
    </button>

    <h1>Skabsregistrering – Admin</h1>


    <h2>📋 Opgaver</h2>

    <div id="tasks">
      Henter opgaver...
    </div>


    <div id="status"></div>


    <h2>🔐 Skabe</h2>

    <div id="lockers">
      Indlæser skabe...
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XU7y4WVGX4Osj7ixgRIfDA_mHpJ1ttv";

let accessToken = "";
let currentUser = null;
let employeeMap = {};


function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const status =
    document.getElementById("loginStatus");

  status.textContent = "Logger ind...";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error_description ||
        data.msg ||
        "Login mislykkedes."
      );
    }

    accessToken = data.access_token;
    currentUser = data.user;

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminContent").style.display = "block";

    await loadAdmin();

  } catch (error) {

    status.className = "error";
    status.textContent = error.message;
  }
}


async function loadAdmin() {

  const status =
    document.getElementById("status");

  status.textContent = "Henter data...";

  try {

    await loadTasks();


    const employeesResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/employees?select=id,employee_id,name,email`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${accessToken}`
        }
      }
    );

    if (!employeesResponse.ok) {
      throw new Error("Kunne ikke hente medarbejdere.");
    }

    const employees =
      await employeesResponse.json();

    employeeMap = {};

    employees.forEach(employee => {
      employeeMap[employee.id] = employee;
    });


    const historyResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/locker_history?select=id,locker_number,floor,employee_id,employee_name,assigned_at,released_at,released_by&order=assigned_at.desc`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${accessToken}`
        }
      }
    );

    if (!historyResponse.ok) {
      throw new Error("Kunne ikke hente historik.");
    }

    const history =
      await historyResponse.json();


    const lockersResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/lockers?select=id,locker_number,floor,status,employee_id,assigned_at,locker_code&order=locker_number`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${accessToken}`
        }
      }
    );

    if (!lockersResponse.ok) {

      const errorText =
        await lockersResponse.text();

      throw new Error(
        `Kunne ikke hente skabe. Fejl ${lockersResponse.status}: ${errorText}`
      );
    }

    const lockers =
      await lockersResponse.json();


    renderLockers(lockers, history);

    status.className = "success";
    status.textContent =
      `${lockers.length} skabe indlæst.`;

  } catch (error) {

    status.className = "error";
    status.textContent = error.message;
  }
}


async function loadTasks() {

  const container =
    document.getElementById("tasks");

  container.innerHTML =
    "Henter opgaver...";


  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/locker_requests?select=id,locker_number,employee_name,employee_email,request_type,message,status,created_at,completed_at&order=created_at.desc`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${accessToken}`
        }
      }
    );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        `Kunne ikke hente opgaver. Fejl ${response.status}: ${errorText}`
      );
    }


    const tasks =
      await response.json();


    if (tasks.length === 0) {

      container.innerHTML =
        "<p>Ingen opgaver.</p>";

      return;
    }


    container.innerHTML = "";


    tasks.forEach(task => {

      const div =
        document.createElement("div");


      div.className =
        "task " +
        (
          task.status === "completed"
            ? "completed"
            : ""
        );


      const statusText =
        task.status === "completed"
          ? "Færdig"
          : "Åben";


      const statusClass =
        task.status === "completed"
          ? "task-status-completed"
          : "task-status-open";


      let html = `

        <div class="task-title">
          Skab ${escapeHtml(task.locker_number)}
        </div>

        <strong>Medarbejder:</strong>
        ${escapeHtml(task.employee_name || "Ukendt")}<br>

        <strong>Norlys-mail:</strong>
        ${escapeHtml(task.employee_email || "Ukendt")}<br>

        <strong>Type:</strong>
        ${escapeHtml(task.request_type || "-")}<br>

        <strong>Beskrivelse:</strong>
        ${escapeHtml(task.message || "Ingen beskrivelse")}<br>

        <div class="task-status">
          <strong>Status:</strong>
          <span class="${statusClass}">
            ${statusText}
          </span>
        </div>
      `;


      if (task.status !== "completed") {

        html += `

          <button
            class="complete-button"
            onclick="completeTask('${task.id}')"
          >
            ✅ Færdig
          </button>

        `;

      } else {

        html += `
          <strong>Færdiggjort:</strong>
          ${formatDate(task.completed_at)}
        `;

      }


      div.innerHTML =
        html;


      container.appendChild(div);

    });


  } catch (error) {

    container.innerHTML =
      `<div class="error">${escapeHtml(error.message)}</div>`;

  }

}


async function completeTask(taskId) {

  if (!confirm(
    "Er opgaven færdigbehandlet?"
  )) {
    return;
  }


  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/locker_requests?id=eq.${encodeURIComponent(taskId)}`,
        {
          method: "PATCH",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${accessToken}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({

            status:
              "completed",

            completed_at:
              new Date().toISOString(),

            completed_by:
              currentUser.id

          })
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        `Kunne ikke færdiggøre opgaven: ${errorText}`
      );

    }


    await loadTasks();


  } catch (error) {

    alert(error.message);

  }

}


function formatDate(date) {

  if (!date) {
    return "-";
  }

  return new Date(date).toLocaleString("da-DK");
}


function renderLockers(lockers, history) {

  const container =
    document.getElementById("lockers");

  container.innerHTML = "";


  const floors = {
    0: "Stuen",
    1: "Etage 1",
    2: "Etage 2",
    3: "Etage 3"
  };


  for (let floor = 0; floor <= 3; floor++) {

    const floorLockers =
      lockers.filter(locker =>
        Number(locker.floor) === floor
      );


    if (floorLockers.length === 0) {
      continue;
    }


    const floorDiv =
      document.createElement("div");

    floorDiv.className = "floor";


    const title =
      document.createElement("h2");

    title.textContent =
      floors[floor];

    floorDiv.appendChild(title);


    floorLockers.forEach(locker => {

      const employee =
        locker.employee_id
          ? employeeMap[locker.employee_id]
          : null;


      const lockerHistory =
        history.filter(item =>
          item.locker_number === locker.locker_number
        );


      const lockerDiv =
        document.createElement("div");


      lockerDiv.className =
        "locker " +
        (
          locker.status === "occupied"
            ? "occupied"
            : "available"
        );


      let html = `
        <strong>Skab ${escapeHtml(locker.locker_number)}</strong><br><br>
      `;


      if (locker.status === "occupied") {

        html += `
          <strong>Status:</strong> Optaget<br>
          <strong>Navn:</strong>
          ${escapeHtml(employee?.name || "Ukendt")}<br>
          <strong>E-mail:</strong>
          ${escapeHtml(employee?.email || "Ukendt")}<br>
          <strong>4-cifret kode:</strong>
          ${escapeHtml(locker.locker_code || "Ingen kode")}<br>
          <strong>Registreret:</strong>
          ${formatDate(locker.assigned_at)}<br>

          <button
            class="release-button"
            onclick="releaseLocker(
              '${locker.id}',
              '${locker.locker_number}',
              '${locker.employee_id}'
            )"
          >
            Frigiv skab
          </button>
        `;

      } else {

        html += `
          <strong>Status:</strong> Ledigt
        `;
      }


      if (lockerHistory.length > 0) {

        html += `
          <details class="history">
            <summary>
              ▶ Vis historik (${lockerHistory.length})
            </summary>
        `;


        lockerHistory.forEach(item => {

          const releasedText =
            item.released_at
              ? `Frigivet: ${formatDate(item.released_at)}`
              : "Ikke frigivet";


          html += `
            <div class="history-item">
              <strong>${escapeHtml(item.employee_name)}</strong><br>
              Registreret: ${formatDate(item.assigned_at)}<br>
              ${releasedText}
            </div>
          `;
        });


        html += `
          </details>
        `;
      }


      lockerDiv.innerHTML =
        html;

      floorDiv.appendChild(
        lockerDiv
      );

    });


    container.appendChild(
      floorDiv
    );

  }

}


async function releaseLocker(
  lockerId,
  lockerNumber,
  employeeId
) {

  if (!confirm(
    `Vil du frigive skab ${lockerNumber}?`
  )) {
    return;
  }


  try {

    const historyResponse =
      await fetch(
        `${SUPABASE_URL}/rest/v1/locker_history?locker_number=eq.${encodeURIComponent(lockerNumber)}&employee_id=eq.${encodeURIComponent(employeeId)}&released_at=is.null&order=assigned_at.desc&limit=1`,
        {
          method: "PATCH",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${accessToken}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({

            released_at:
              new Date().toISOString(),

            released_by:
              currentUser.id

          })
        }
      );


    if (!historyResponse.ok) {

      const errorText =
        await historyResponse.text();

      throw new Error(
        "Kunne ikke opdatere historikken: " +
        errorText
      );
    }


    const lockerResponse =
      await fetch(
        `${SUPABASE_URL}/rest/v1/lockers?id=eq.${encodeURIComponent(lockerId)}`,
        {
          method: "PATCH",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${accessToken}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({

            status:
              "available",

            employee_id:
              null,

            assigned_at:
              null

          })
        }
      );


    if (!lockerResponse.ok) {

      const errorText =
        await lockerResponse.text();

      throw new Error(
        "Kunne ikke frigive skabet: " +
        errorText
      );
    }


    await loadAdmin();


  } catch (error) {

    alert(error.message);

  }

}


async function logout() {

  try {

    await fetch(
      `${SUPABASE_URL}/auth/v1/logout`,
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${accessToken}`
        }
      }
    );

  } catch (error) {
  }


  accessToken = "";
  currentUser = null;


  document
    .getElementById("adminContent")
    .style.display = "none";


  document
    .getElementById("loginBox")
    .style.display = "block";


  document
    .getElementById("loginStatus")
    .textContent = "";

}


document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    login
  );


document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    logout
  );

</script>

</body>
</html>
