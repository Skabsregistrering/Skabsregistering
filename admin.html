<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Skabsregistrering – Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 1100px;
      margin: auto;
    }

    .login,
    .admin {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .login {
      max-width: 450px;
      margin: 50px auto;
    }

    h1 {
      text-align: center;
    }

    h3 {
      margin-bottom: 8px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }

    .login button {
      width: 100%;
      background: #2563eb;
      color: white;
    }

    .logout {
      background: #ef4444;
      color: white;
      float: right;
    }

    .floor {
      margin-top: 30px;
    }

    .locker {
      background: white;
      border-left: 8px solid #22c55e;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
    }

    .locker.occupied {
      border-left-color: #ef4444;
    }

    .release {
      background: #ef4444;
      color: white;
      margin-left: 10px;
    }

    .history {
      margin-top: 18px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    .history-item {
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .error {
      color: #dc2626;
      margin-top: 15px;
    }

    .success {
      color: #16a34a;
      margin-top: 15px;
    }

    .clear {
      clear: both;
    }
  </style>
</head>

<body>

<div class="box">

  <div id="loginBox" class="login">

    <h1>Admin login</h1>

    <label for="email">E-mail</label>
    <input type="email" id="email">

    <label for="password">Password</label>
    <input type="password" id="password">

    <button onclick="login()">Log ind</button>

    <div id="loginStatus"></div>

  </div>


  <div id="adminBox" class="admin" style="display:none;">

    <button class="logout" onclick="logout()">Log ud</button>

    <h1>Skabsregistrering – Admin</h1>

    <div class="clear"></div>

    <div id="status"></div>

    <div id="lockers">
      Indlæser skabe...
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XU7y4WVGX4Osj7ixgRIfDA_mHpJ1ttv";

let accessToken = null;
let currentUserId = null;


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const status =
    document.getElementById("loginStatus");

  status.textContent = "Logger ind...";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error_description ||
        data.msg ||
        "Login mislykkedes."
      );
    }

    accessToken = data.access_token;
    currentUserId = data.user?.id || null;

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminBox").style.display = "block";

    loadLockers();

  } catch (error) {

    status.innerHTML =
      `<div class="error">${error.message}</div>`;
  }
}


async function loadLockers() {

  const container =
    document.getElementById("lockers");

  const status =
    document.getElementById("status");

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/lockers?select=locker_number,floor,status,employee_id,assigned_at&order=locker_number`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        `Fejl ${response.status}: ${errorText}`
      );
    }

    const lockers =
      await response.json();

    container.innerHTML = "";

    const floors = {
      0: "Stuen",
      1: "Etage 1",
      2: "Etage 2",
      3: "Etage 3"
    };


    for (let floor = 0; floor <= 3; floor++) {

      const floorLockers =
        lockers.filter(locker =>
          locker.floor === floor
        );

      if (floorLockers.length === 0) {
        continue;
      }


      const floorDiv =
        document.createElement("div");

      floorDiv.className = "floor";


      const title =
        document.createElement("h2");

      title.textContent =
        floors[floor];

      floorDiv.appendChild(title);


      for (const locker of floorLockers) {

        const div =
          document.createElement("div");

        div.className =
          "locker " +
          (locker.status === "occupied"
            ? "occupied"
            : "");


        let html =
          `<strong>Skab ${locker.locker_number}</strong><br>`;

        html +=
          `Status: ${locker.status}<br>`;


        /*
         * Hent medarbejder
         */
        if (locker.employee_id) {

          try {

            const employeeResponse =
              await fetch(
                `${SUPABASE_URL}/rest/v1/employees?id=eq.${encodeURIComponent(locker.employee_id)}&select=name,email`,
                {
                  headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${accessToken}`
                  }
                }
              );


            if (employeeResponse.ok) {

              const employees =
                await employeeResponse.json();


              if (employees.length > 0) {

                const employee =
                  employees[0];

                html +=
                  `<strong>Navn:</strong> ${
                    escapeHtml(employee.name || "Ikke registreret")
                  }<br>`;

                html +=
                  `<strong>E-mail:</strong> ${
                    escapeHtml(employee.email || "Ikke registreret")
                  }<br>`;
              }

            }

          } catch (error) {

            html +=
              `<strong>Medarbejder:</strong> Kunne ikke hentes<br>`;
          }
        }


        if (locker.assigned_at) {

          html +=
            `<strong>Registreret:</strong> ${
              new Date(locker.assigned_at)
                .toLocaleString("da-DK")
            }<br>`;
        }


        if (locker.status === "occupied") {

          html +=
            `<button class="release"
              onclick="releaseLocker('${locker.locker_number}')">
              Frigiv skab
            </button>`;
        }


        /*
         * Historik
         */
        html += `
          <div class="history">
            <h3>Historik</h3>
            <div id="history-${locker.locker_number.replace(/\./g, "-")}">
              Henter historik...
            </div>
          </div>
        `;


        div.innerHTML = html;

        floorDiv.appendChild(div);


        /*
         * Hent historik efter elementet er oprettet
         */
        loadHistory(
          locker.locker_number,
          document.getElementById(
            `history-${locker.locker_number.replace(/\./g, "-")}`
          )
        );

      }


      container.appendChild(floorDiv);

    }


    status.innerHTML =
      `<div class="success">Skabe indlæst.</div>`;

  } catch (error) {

    status.innerHTML =
      `<div class="error">${error.message}</div>`;
  }
}


async function loadHistory(lockerNumber, container) {

  if (!container) {
    return;
  }

  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/locker_history?locker_number=eq.${encodeURIComponent(lockerNumber)}&select=employee_name,assigned_at,released_at,release_reason,release_comment&order=assigned_at.desc`,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${accessToken}`
          }
        }
      );


    if (!response.ok) {

      container.innerHTML =
        "Historik kunne ikke hentes.";

      return;
    }


    const history =
      await response.json();


    if (history.length === 0) {

      container.innerHTML =
        "Ingen tidligere registreringer.";

      return;
    }


    container.innerHTML = "";


    history.forEach(item => {

      const div =
        document.createElement("div");

      div.className =
        "history-item";


      let text =
        `<strong>${escapeHtml(
          item.employee_name || "Ukendt"
        )}</strong><br>`;


      if (item.assigned_at) {

        text +=
          `Registreret: ${
            new Date(item.assigned_at)
              .toLocaleString("da-DK")
          }<br>`;
      }


      if (item.released_at) {

        text +=
          `Frigivet: ${
            new Date(item.released_at)
              .toLocaleString("da-DK")
          }<br>`;
      } else {

        text +=
          `<strong>Aktiv registrering</strong><br>`;
      }


      if (item.release_reason) {

        text +=
          `Årsag: ${escapeHtml(
            item.release_reason
          )}<br>`;
      }


      if (item.release_comment) {

        text +=
          `Kommentar: ${escapeHtml(
            item.release_comment
          )}<br>`;
      }


      div.innerHTML = text;

      container.appendChild(div);

    });


  } catch (error) {

    container.innerHTML =
      "Historik kunne ikke hentes.";
  }
}


async function releaseLocker(lockerNumber) {

  if (!confirm(
    `Vil du frigive skab ${lockerNumber}?`
  )) {
    return;
  }


  const status =
    document.getElementById("status");


  try {

    /*
     * Hent aktiv historik
     */
    const historyResponse =
      await fetch(
        `${SUPABASE_URL}/rest/v1/locker_history?locker_number=eq.${encodeURIComponent(lockerNumber)}&released_at=is.null&select=id`,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${accessToken}`
          }
        }
      );


    if (historyResponse.ok) {

      const activeHistory =
        await historyResponse.json();


      if (activeHistory.length > 0) {

        await fetch(
          `${SUPABASE_URL}/rest/v1/locker_history?id=eq.${activeHistory[0].id}`,
          {
            method: "PATCH",

            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${accessToken}`,
              "Prefer": "return=minimal"
            },

            body: JSON.stringify({
              released_at: new Date().toISOString(),
              released_by: currentUserId,
              release_reason: "Frigivet af admin"
            })
          }
        );
      }
    }


    /*
     * Frigiv selve skabet
     */
    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/lockers?locker_number=eq.${encodeURIComponent(lockerNumber)}`,
        {
          method: "PATCH",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({
            status: "available",
            employee_id: null,
            assigned_at: null
          })
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        `Fejl ${response.status}: ${errorText}`
      );
    }


    status.innerHTML =
      `<div class="success">
        Skab ${lockerNumber} er frigivet.
      </div>`;


    loadLockers();


  } catch (error) {

    status.innerHTML =
      `<div class="error">${error.message}</div>`;
  }
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function logout() {

  accessToken = null;
  currentUserId = null;

  document.getElementById("adminBox").style.display = "none";
  document.getElementById("loginBox").style.display = "block";

  document.getElementById("password").value = "";
}

</script>

</body>
</html>
