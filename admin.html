<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skabsregistrering – Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
    }

    h1 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    button {
      padding: 8px 12px;
      border: 0;
      border-radius: 6px;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Skabsregistrering – Admin</h1>

  <div id="message" class="message">Henter skabe...</div>

  <table id="lockerTable" style="display:none;">
    <thead>
      <tr>
        <th>Skab</th>
        <th>Etage</th>
        <th>Status</th>
        <th>Medarbejder</th>
        <th>Handling</th>
      </tr>
    </thead>

    <tbody id="lockerBody"></tbody>
  </table>
</div>

<script>

const SUPABASE_URL =
  "https://pwgwujojffxinfbqjlyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_G7rR-9dHQLEdCLpysjNeKA_VHqhCsYz";

async function loadLockers() {

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/lockers?select=*`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("Kunne ikke hente skabe.");
    }

    const lockers = await response.json();

    const body = document.getElementById("lockerBody");
    const table = document.getElementById("lockerTable");
    const message = document.getElementById("message");

    body.innerHTML = "";

    lockers.forEach(locker => {

      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${locker.locker_number}</td>
        <td>${locker.floor}</td>
        <td>${locker.status}</td>
        <td>${locker.employee_id || "-"}</td>
        <td>
          ${
            locker.status === "occupied"
            ? `<button onclick="releaseLocker('${locker.id}')">Frigiv</button>`
            : "-"
          }
        </td>
      `;

      body.appendChild(row);
    });

    message.style.display = "none";
    table.style.display = "table";

  } catch (error) {

    document.getElementById("message").innerText =
      "Fejl: " + error.message;

  }
}

async function releaseLocker(id) {

  if (!confirm("Vil du frigive dette skab?")) {
    return;
  }

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/lockers?id=eq.${id}`,
    {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      },
      body: JSON.stringify({
        status: "available",
        employee_id: null,
        assigned_at: null,
        updated_at: new Date().toISOString()
      })
    }
  );

  if (!response.ok) {
    alert("Kunne ikke frigive skabet.");
    return;
  }

  loadLockers();
}

loadLockers();

</script>

</body>
</html>
